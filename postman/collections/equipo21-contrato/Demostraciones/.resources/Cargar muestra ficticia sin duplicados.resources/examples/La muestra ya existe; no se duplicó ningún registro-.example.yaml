$kind: http-example
name: La muestra ya existe; no se duplicó ningún registro.
request:
  url: "{{baseUrl}}/v1/demostraciones/arquitectura-ficticia-v1"
  method: PUT
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
