$kind: http-example
name: Sesión válida sin rol o capa de edición requeridos. No se aplican cambios.
request:
  url: "{{baseUrl}}/v1/tipos-elemento"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "nombre": "@",
        "capaId": "5223032c-af33-c3cc-96f1-804d9522b711"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "codigo": "string",
        "mensaje": "string",
        "detalles": [
          {
            "campo": "string",
            "motivo": "string"
          },
          {
            "campo": "string",
            "motivo": "string"
          }
        ]
      }
order: 4000
