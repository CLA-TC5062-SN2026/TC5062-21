$kind: http-request
description: Permite corregir una propuesta cuya aprobación falló; sigue pendiente y conserva la versión vigente de la relación. Revalida referencias, duplicados y permisos. No modifica propuestas aprobadas/rechazadas ni publica relaciones. Administrador o Editor autorizado sobre la capa afectada; Consulta no puede escribir. Este PATCH usa asignaciones de valores, no incrementos ni anexos; repetir el mismo cuerpo sin cambios externos conserva el mismo estado de negocio.
url: "{{baseUrl}}/v1/propuestas-relacion/:propuestaId"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: propuestaId
    value: be8ad9b0-8b6d-83b5-d2e0-ec5137bc856f
    disabled: false
    description: (Required) Identificador UUID del recurso.
body:
  type: json
  content: |-
    {
      "origenId": "b4016cf0-2170-524e-d042-9c98fd7bb1a3",
      "tipoRelacionId": "ba8866dd-cb6e-6db0-3885-af7136f2eb0a",
      "destinoId": "8d905eb4-2d7a-7260-7c22-66b87bb15edf",
      "justificacion": "stringstring",
      "versionBase": 631
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Corregir una propuesta pendiente.resources/examples
order: 4000
