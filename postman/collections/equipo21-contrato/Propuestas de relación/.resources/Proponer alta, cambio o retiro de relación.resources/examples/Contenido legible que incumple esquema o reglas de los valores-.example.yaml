$kind: http-example
name: "Contenido legible que incumple esquema o reglas de los valores: obligatorio vacío, tipo/fecha/opción inválidos, extremos incompatibles o inactivos, autorrelación o justificación fuera de rango. detalles identifica los datos inválidos. No hay cambios parciales. Los conflictos con el estado actual se devuelven como 409."
