$kind: http-request
description: Conserva y recupera valores propuestos, autoría y decisión entre sesiones. Lectura disponible para toda cuenta autenticada.
url: "{{baseUrl}}/v1/propuestas-relacion/:propuestaId"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: propuestaId
    value: be8ad9b0-8b6d-83b5-d2e0-ec5137bc856f
    disabled: false
    description: (Required) Identificador UUID del recurso.
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Consultar propuesta y su decisión.resources/examples
order: 3000
