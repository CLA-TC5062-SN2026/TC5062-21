$kind: http-request
description: Devuelve campos del tipo, incluido Nombre, para interpretación de valores y formularios. Lectura disponible para toda cuenta autenticada.
url: "{{baseUrl}}/v1/tipos-elemento/:tipoId/campos"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: tipoId
    value: be8ad9b0-8b6d-83b5-d2e0-ec5137bc856f
    disabled: false
    description: (Required) Identificador UUID del recurso.
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Consultar campos y opciones.resources/examples
order: 1000
