$kind: http-request
description: Recupera los tipos de origen/destino permitidos y descripción. Lectura disponible para toda cuenta autenticada.
url: "{{baseUrl}}/v1/tipos-relacion/:tipoRelacionId"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: tipoRelacionId
    value: be8ad9b0-8b6d-83b5-d2e0-ec5137bc856f
    disabled: false
    description: (Required) Identificador UUID del recurso.
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Consultar definición de relación.resources/examples
order: 3000
