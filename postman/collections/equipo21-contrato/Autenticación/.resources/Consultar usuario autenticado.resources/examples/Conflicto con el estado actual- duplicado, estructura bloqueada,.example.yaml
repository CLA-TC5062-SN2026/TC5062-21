$kind: http-example
name: "Conflicto con el estado actual: duplicado, estructura bloqueada, versión obsoleta, propuesta ya resuelta o pendiente simultánea, último administrador. No se altera ningún recurso. El cliente debe revisar el estado antes de intentar otra operación."
request:
  url: "{{baseUrl}}/auth/me"
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "codigo": "string",
        "mensaje": "string",
        "detalles": [
          {
            "campo": "string",
            "motivo": "string"
          },
          {
            "campo": "string",
            "motivo": "string"
          }
        ]
      }
order: 5000
