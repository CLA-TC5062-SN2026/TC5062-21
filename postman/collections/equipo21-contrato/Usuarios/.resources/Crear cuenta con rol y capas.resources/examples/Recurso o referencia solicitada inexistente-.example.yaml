$kind: http-example
name: Recurso o referencia solicitada inexistente.
request:
  url: "{{baseUrl}}/v1/usuarios"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "correo": "ayEJEW2Jr@UJleACXFjNPyT.uj",
        "nombre": "N",
        "contrasenaInicial": "stringstring",
        "rol": "Editor"
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "codigo": "string",
        "mensaje": "string",
        "detalles": [
          {
            "campo": "string",
            "motivo": "string"
          },
          {
            "campo": "string",
            "motivo": "string"
          }
        ]
      }
order: 5000
