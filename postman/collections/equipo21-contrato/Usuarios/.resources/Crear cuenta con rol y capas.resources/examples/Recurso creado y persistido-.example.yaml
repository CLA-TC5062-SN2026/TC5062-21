$kind: http-example
name: Recurso creado y persistido.
request:
  url: "{{baseUrl}}/v1/usuarios"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "correo": "ayEJEW2Jr@UJleACXFjNPyT.uj",
        "nombre": "N",
        "contrasenaInicial": "stringstring",
        "rol": "Editor"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    - key: Location
      value: /api/v1/usuarios/00000000-0000-4000-8000-000000000005
      disabled: false
      description: URI del recurso o evento inmutable creado; se envía en todo 201 de este contrato. Ejemplo ficticio bajo /api/v1.
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "id": "3cf5aa13-c7ec-7192-5ff3-7194602b31b1",
        "correo": "NFkl@ygqNnin.np",
        "nombre": "string",
        "rol": "Editor",
        "activo": false,
        "capasEditables": [
          "e09ba405-e4ae-c5c1-3e74-e96ec20a4a6c",
          "e8dc6642-bd25-1180-a782-e4ab20879d63"
        ]
      }
order: 1000
