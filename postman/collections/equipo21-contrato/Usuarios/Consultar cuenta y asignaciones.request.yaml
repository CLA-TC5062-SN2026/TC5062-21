$kind: http-request
description: Recupera estado, rol y capas editables de una cuenta, incluso desactivada. Solo Administrador.
url: "{{baseUrl}}/v1/usuarios/:usuarioId"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: usuarioId
    value: be8ad9b0-8b6d-83b5-d2e0-ec5137bc856f
    disabled: false
    description: (Required) Identificador UUID del recurso.
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Consultar cuenta y asignaciones.resources/examples
order: 3000
