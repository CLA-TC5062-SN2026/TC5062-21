$kind: http-example
name: "Contenido legible que incumple esquema o reglas de los valores: obligatorio vacío, tipo/fecha/opción inválidos, extremos incompatibles o inactivos, autorrelación o justificación fuera de rango. detalles identifica los datos inválidos. No hay cambios parciales. Los conflictos con el estado actual se devuelven como 409."
request:
  url: "{{baseUrl}}/v1/elementos/:elementoId"
  method: PATCH
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  pathVariables:
    - key: elementoId
      value: be8ad9b0-8b6d-83b5-d2e0-ec5137bc856f
      disabled: false
      description: (Required) Identificador UUID del recurso.
  body:
    type: json
    content: |-
      {
        "valores": [
          {
            "campoId": "968dc06b-d8a9-1f3d-a0ff-4a42d7d00643",
            "texto": "string"
          }
        ],
        "estado": "activo"
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "codigo": "string",
        "mensaje": "string",
        "detalles": [
          {
            "campo": "string",
            "motivo": "string"
          },
          {
            "campo": "string",
            "motivo": "string"
          }
        ]
      }
order: 9000
