$kind: http-request
description: Consulta inmutable para cualquier cuenta autenticada, según la visibilidad general del SRS. Registra altas, modificaciones, bajas, reactivaciones, propuestas, decisiones y cambios de acceso. Orden fecha descendente y luego ID. Instantáneas excluyen contraseñas, hashes, JWT y secretos. Lectura disponible para toda cuenta autenticada.
url: "{{baseUrl}}/v1/entradas-bitacora?pagina=1&objetoId=be8ad9b0-8b6d-83b5-d2e0-ec5137bc856f&tipoObjeto=string&actorId=be8ad9b0-8b6d-83b5-d2e0-ec5137bc856f"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: pagina
    value: "1"
    disabled: false
    description: Página desde 1; tamaño fijo de 25.
