$kind: http-request
description: Permite inspeccionar actor, fecha, objeto, acción y valores públicos antes/después. No existe una operación de escritura sobre la bitácora. PUT, PATCH y DELETE sobre esta URI deben responder 405 con Error y conservar la entrada. Lectura disponible para toda cuenta autenticada.
url: "{{baseUrl}}/v1/entradas-bitacora/:entradaId"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: entradaId
    value: be8ad9b0-8b6d-83b5-d2e0-ec5137bc856f
    disabled: false
    description: (Required) Identificador UUID del recurso.
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Consultar entrada inmutable.resources/examples
order: 2000
