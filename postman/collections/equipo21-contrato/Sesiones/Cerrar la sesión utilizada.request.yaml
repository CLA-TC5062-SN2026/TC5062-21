$kind: http-request
description: "Revoca solo el sid/jti de este Bearer. Otros JWT de la cuenta continúan autorizando solicitudes. Reutilizar este JWT devuelve 401. Confirma el cierre con un mensaje JSON. Acción disponible para toda cuenta autenticada. Repetir con el JWT ya revocado devuelve 401: la sesión sigue revocada y otras sesiones no cambian. Idempotencia significa mismo efecto, no necesariamente mismo código HTTP."
url: "{{baseUrl}}/v1/sesiones/actual"
method: DELETE
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Cerrar la sesión utilizada.resources/examples
order: 3000
