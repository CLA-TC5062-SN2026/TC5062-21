url: "{{baseUrl}}/v1/capas"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "nombre": "@"
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Crear capa.resources/examples
order: 2000
