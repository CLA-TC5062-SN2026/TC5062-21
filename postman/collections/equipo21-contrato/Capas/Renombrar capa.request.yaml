$kind: http-request
description: Mantiene identidad y asociaciones, aplica unicidad global y registra el cambio. No elimina la capa. Solo Administrador. Este PATCH usa asignaciones de valores, no incrementos ni anexos; repetir el mismo cuerpo sin cambios externos conserva el mismo estado de negocio.
url: "{{baseUrl}}/v1/capas/:capaId"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: capaId
    value: be8ad9b0-8b6d-83b5-d2e0-ec5137bc856f
    disabled: false
    description: (Required) Identificador UUID del recurso.
body:
  type: json
  content: |-
    {
      "nombre": "@"
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Renombrar capa.resources/examples
order: 4000
