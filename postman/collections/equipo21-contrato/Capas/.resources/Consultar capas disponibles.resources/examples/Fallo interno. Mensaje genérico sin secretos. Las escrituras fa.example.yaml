$kind: http-example
name: Fallo interno. Mensaje genérico sin secretos. Las escrituras fallidas se revierten.
request:
  url: "{{baseUrl}}/v1/capas"
  method: GET
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
