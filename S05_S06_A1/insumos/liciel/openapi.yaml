      summary: Consultar la bitácora
      description: |
        Bitácora inmutable y de solo lectura: la API no expone ninguna operación para crear, editar o borrar entradas
        (un intento de escritura recibe 405 con `Allow: GET`). No contiene contraseñas ni secretos.
      x-acceptance-criteria:
      - RF-18-AC-2
      - RF-18-AC-3
      x-required-roles:
      - admin
      parameters:
      - name: objectType
        in: query
        schema:
          type: string
          enum:
          - user
          - layer
          - element-type
          - element
          - relation-type
          - relationship
          - relationship-proposal
      - name: objectId
        in: query
        schema:
          type: string
          format: uuid
      - name: actorId
        in: query
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Página de entradas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /demo-datasets:
    post:
      tags:
      - demo-data
      operationId: createDemoDataset
      summary: Cargar la muestra ficticia de demostración
      description: 'Idempotente a nivel de servidor aunque use POST: si la muestra no existe la crea (201); si ya existía no duplica capas, elementos ni relaciones y responde 200 con `alreadyLoaded=true`. La muestra es única y no tiene identificador propio, por eso no se devuelve `Location`; su estado se conoce por `alreadyLoaded`.'
      x-acceptance-criteria:
      - RF-17-AC-1
      - RF-17-AC-2
      x-required-roles:
      - admin
      responses:
        '200':
          description: La muestra ya existía; no se duplicó nada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoDataset'
        '201':
          description: Muestra cargada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoDataset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT obtenido en `POST /auth/sessions`. Incluye `sub` (cuenta), `sid` (sesión) y `exp`.
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LayerId:
      name: layerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ElementTypeId:
      name: elementTypeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ElementId:
      name: elementId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RelationTypeId:
      name: relationTypeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RelationshipId:
      name: relationshipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: Número de página, desde 1. El tamaño de página es fijo (25). Una página mayor que `totalPages` responde 200 con `items` vacío.
      schema:
        type: integer
        minimum: 1
        default: 1
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag de la versión que el cliente leyó (control de concurrencia optimista). Si ya no es la vigente responde 412; si falta, 428.
      schema:
        type: string
  headers:
    Location:
      description: URI relativa a `servers.url` del recurso recién creado.
      schema:
        type: string
        format: uri-reference
      example: /elements/5d1c1c1e-0c6e-4f0a-9d1c-0e7a2f6a9b11
    ETag:
      description: Versión de la representación. El cliente la envía en `If-Match` al modificar el recurso.
      schema:
        type: string
      example: '"7"'
    CacheControlNoStore:
      description: La respuesta contiene secretos y no debe almacenarse en ningún caché.
      schema:
        type: string
        enum:
        - no-store
    RetryAfter:
      description: Segundos que debe esperar el cliente antes de reintentar.
      schema:
        type: integer
        minimum: 1
    WWWAuthenticate:
      description: Esquema de autenticación esperado.
      schema:
        type: string
        enum:
        - Bearer
  responses:
    BadRequest:
      description: Petición mal formada (JSON inválido, parámetro con formato incorrecto, `q` vacío).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Falta la sesión o el token no es válido, expiró o fue invalidado. No se entregan datos protegidos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
    Forbidden:
      description: La sesión es válida pero el rol, o la capa asignada al Editor, no permite la operación. No se altera ningún dato.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: El recurso no existe.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflicto con el estado actual (nombre duplicado, último administrador, recurso en uso).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: La petición está bien formada pero incumple una regla de negocio o validación; `errors[]` identifica el campo.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Error interno. La operación no deja cambios parciales.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: 'La versión enviada en `If-Match` ya no es la vigente: otra persona modificó el recurso. Vuelva a consultarlo y reintente.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: Falta el encabezado `If-Match` en una modificación.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Demasiados intentos; se aplica limitación de frecuencia.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required:
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri-reference
          example: about:blank
        title:
          type: string
          example: Validación fallida
        status:
          type: integer
          example: 422
        detail:
          type: string
        code:
          type: string
          description: Código estable de error para el cliente.
          example: VALIDATION_FAILED
        errors:
          type: array
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                type: string
                example: values.2f6c...
              message:
                type: string
    PageMeta:
      type: object
      required:
      - page
      - pageSize
      - totalItems
      - totalPages
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 25
        totalItems:
          type: integer
        totalPages:
          type: integer
    AuditStamp:
      type: object
      properties:
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedBy:
          type: string
          format: uuid
        updatedAt:
          type: string
          format: date-time
      required:
      - createdBy
      - createdAt
      - updatedBy
      - updatedAt
    Role:
      type: string
      enum:
      - admin
      - editor
      - viewer
      description: admin = Administrador, editor = Editor, viewer = Consulta.
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    SessionCreated:
      type: object
      required:
      - accessToken
      - tokenType
      - expiresIn
      - user
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
          - Bearer
        expiresIn:
          type: integer
          description: Segundos de vigencia absoluta (28800 = 8 h).
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required:
      - id
      - email
      - displayName
      - role
      - isActive
      - editableLayerIds
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        isActive:
          type: boolean
        editableLayerIds:
          type: array
          items:
            type: string
            format: uuid
    UserCreate:
      type: object
      required:
      - email
      - displayName
      - role
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        role:
          $ref: '#/components/schemas/Role'
        editableLayerIds:
          type: array
          description: Solo aplica al rol `editor`.
          items:
            type: string
            format: uuid
    UserCreated:
      allOf:
      - $ref: '#/components/schemas/User'
      - type: object
        required:
        - initialPassword
        properties:
          initialPassword:
            type: string
            description: Se entrega una sola vez; no se vuelve a mostrar.
    UserUpdate:
      type: object
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        role:
          $ref: '#/components/schemas/Role'
        isActive:
          type: boolean
    UserPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/User'
    EditableLayers:
      type: object
      required:
      - layerIds
      properties:
        layerIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    PasswordResetCreated:
      type: object
      required:
      - temporaryPassword
      - createdAt
      properties:
        temporaryPassword:
          type: string
          description: Se entrega una sola vez.
        createdAt:
          type: string
          format: date-time
    Layer:
      allOf:
      - type: object
        required:
        - id
        - name
        properties:
          id:
            type: string
            format: uuid
          name:
            type: string
            example: Negocio
      - $ref: '#/components/schemas/AuditStamp'
    LayerWrite:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: Seguridad
    LayerList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Layer'
    ElementType:
      allOf:
      - type: object
        required:
        - id
        - name
        - layerId
        - hasElements
        properties:
          id:
            type: string
            format: uuid
          name:
            type: string
            example: Proyecto
          layerId:
            type: string
            format: uuid
          hasElements:
            type: boolean
            description: Si es true, la definición de campos está bloqueada.
      - $ref: '#/components/schemas/AuditStamp'
    ElementTypeCreate:
      type: object
      required:
      - name
      - layerId
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        layerId:
          type: string
          format: uuid
    ElementTypeRename:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
    ElementTypeList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ElementType'
    FieldDataType:
      type: string
      enum:
      - text
      - number
      - date
      - select
    FieldDefinition:
      type: object
      required:
      - id
      - name
      - dataType
      - isRequired
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Descripción
        dataType:
          $ref: '#/components/schemas/FieldDataType'
        isRequired:
          type: boolean
        options:
          type: array
          description: Obligatorio y no vacío cuando `dataType=select`.
          items:
            type: string
    FieldDefinitionWrite:
      type: object
      required:
      - name
      - dataType
      - isRequired
      properties:
        id:
          type: string
          format: uuid
          description: Opcional; permite conservar el identificador de un campo existente al reemplazar el conjunto.
        name:
          type: string
          minLength: 1
          maxLength: 80
        dataType:
          $ref: '#/components/schemas/FieldDataType'
        isRequired:
          type: boolean
        options:
          type: array
          items:
            type: string
    FieldSet:
      type: object
      required:
      - fields
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldDefinition'
    FieldSetWrite:
      type: object
      required:
      - fields
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldDefinitionWrite'
    FieldValues:
      type: object
      description: Mapa `fieldId` → valor. Texto como string, número como number, fecha como `YYYY-MM-DD`, selección como una de las opciones configuradas.
      additionalProperties:
        anyOf:
        - type: string
          nullable: true
        - type: number
          nullable: true
    ElementStatus:
      type: string
      enum:
      - active
      - inactive
    Element:
      allOf:
      - type: object
        required:
        - id
        - name
        - elementTypeId
        - layerId
        - status
        - values
        properties:
          id:
            type: string
            format: uuid
            description: Único e inmutable.
          name:
            type: string
            example: Proyecto Alfa
          elementTypeId:
            type: string
            format: uuid
          layerId:
            type: string
            format: uuid
          status:
            $ref: '#/components/schemas/ElementStatus'
          values:
            $ref: '#/components/schemas/FieldValues'
      - $ref: '#/components/schemas/AuditStamp'
    ElementCreate:
      type: object
      required:
      - elementTypeId
      - name
      properties:
        elementTypeId:
          type: string
          format: uuid
        name:
          type: string
          description: Campo base `Nombre`; obligatorio y no puede ser solo espacios.
          maxLength: 200
        values:
          $ref: '#/components/schemas/FieldValues'
    ElementUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 200
        values:
          $ref: '#/components/schemas/FieldValues'
    ElementStatusWrite:
      type: object
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/ElementStatus'
    ElementSummary:
      type: object
      required:
      - id
      - name
      - elementTypeId
      - elementTypeName
      - layerId
      - layerName
      - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        elementTypeId:
          type: string
          format: uuid
        elementTypeName:
          type: string
        layerId:
          type: string
          format: uuid
        layerName:
          type: string
        status:
          $ref: '#/components/schemas/ElementStatus'
    ElementPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/ElementSummary'
    MapNode:
      type: object
      required:
      - id
      - name
      - elementTypeId
      - layerId
      - isOrigin
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        elementTypeId:
          type: string
          format: uuid
        layerId:
          type: string
          format: uuid
        isOrigin:
          type: boolean
    MapEdge:
      type: object
      required:
      - relationshipId
      - relationTypeId
      - sourceElementId
      - targetElementId
      properties:
        relationshipId:
          type: string
          format: uuid
        relationTypeId:
          type: string
          format: uuid
        sourceElementId:
          type: string
          format: uuid
        targetElementId:
          type: string
          format: uuid
    ElementMap:
      type: object
      required:
      - originId
      - nodes
      - edges
      - truncated
      - maxNodes
      properties:
        originId:
          type: string
          format: uuid
        nodes:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/MapNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/MapEdge'
        truncated:
          type: boolean
        maxNodes:
          type: integer
          example: 100
    RelationType:
      allOf:
      - type: object
        required:
        - id
        - name
        - sourceElementTypeId
        - targetElementTypeId
        properties:
          id:
            type: string
            format: uuid
          name:
            type: string
            example: mejora
          description:
            type: string
          sourceElementTypeId:
            type: string
            format: uuid
          targetElementTypeId:
            type: string
            format: uuid
      - $ref: '#/components/schemas/AuditStamp'
    RelationTypeCreate:
      type: object
      required:
      - name
      - sourceElementTypeId
      - targetElementTypeId
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 500
        sourceElementTypeId:
          type: string
          format: uuid
        targetElementTypeId:
          type: string
          format: uuid
    RelationTypeUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 500
    RelationTypeList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RelationType'
    RelationshipStatus:
      type: string
      enum:
      - active
      - retired
      description: active = vigente, retired = retirada.
    Relationship:
      allOf:
      - type: object
        required:
        - id
        - relationTypeId
        - sourceElementId
        - targetElementId
        - justification
        - status
        properties:
          id:
            type: string
            format: uuid
          relationTypeId:
            type: string
            format: uuid
          sourceElementId:
            type: string
            format: uuid
          targetElementId:
            type: string
            format: uuid
          justification:
            type: string
            minLength: 10
            maxLength: 500
          status:
            $ref: '#/components/schemas/RelationshipStatus'
          approvedBy:
            type: string
            format: uuid
          approvedAt:
            type: string
            format: date-time
      - $ref: '#/components/schemas/AuditStamp'
    RelationshipPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Relationship'
    ProposalCreateRelationship:
      type: object
      required:
      - kind
      - relationTypeId
      - sourceElementId
      - targetElementId
      - justification
      properties:
        kind:
          type: string
          enum:
          - create
        relationTypeId:
          type: string
          format: uuid
        sourceElementId:
          type: string
          format: uuid
        targetElementId:
          type: string
          format: uuid
        justification:
          type: string
          minLength: 10
          maxLength: 500
    ProposalChangeRelationship:
      type: object
      required:
      - kind
      - relationshipId
      - justification
      description: Además de `relationshipId` y la justificación, debe enviarse al menos un valor propuesto (tipo, origen o destino).
      properties:
        kind:
          type: string
          enum:
          - change
        relationshipId:
          type: string
          format: uuid
        relationTypeId:
          type: string
          format: uuid
        sourceElementId:
          type: string
          format: uuid
        targetElementId:
          type: string
          format: uuid
        justification:
          type: string
          minLength: 10
          maxLength: 500
      anyOf:
      - required:
        - relationTypeId
      - required:
        - sourceElementId
      - required:
        - targetElementId
    ProposalRetireRelationship:
      type: object
      required:
      - kind
      - relationshipId
      - justification
      properties:
        kind:
          type: string
          enum:
          - retire
        relationshipId:
          type: string
          format: uuid
        justification:
          type: string
          minLength: 10
          maxLength: 500
    ProposalCreate:
      oneOf:
      - $ref: '#/components/schemas/ProposalCreateRelationship'
      - $ref: '#/components/schemas/ProposalChangeRelationship'
      - $ref: '#/components/schemas/ProposalRetireRelationship'
      discriminator:
        propertyName: kind
        mapping:
          create: '#/components/schemas/ProposalCreateRelationship'
          change: '#/components/schemas/ProposalChangeRelationship'
          retire: '#/components/schemas/ProposalRetireRelationship'
    ProposalDecisionWrite:
      type: object
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - approved
          - rejected
        comment:
          type: string
          maxLength: 500
    ProposalDecision:
      type: object
      required:
      - decision
      - decidedBy
      - decidedAt
      properties:
        decision:
          type: string
          enum:
          - approved
          - rejected
        decidedBy:
          type: string
          format: uuid
        decidedAt:
          type: string
          format: date-time
        comment:
          type: string
    RelationshipProposal:
      allOf:
      - type: object
        required:
        - id
        - kind
        - status
        - justification
        properties:
          id:
            type: string
            format: uuid
          kind:
            type: string
            enum:
            - create
            - change
            - retire
          status:
            type: string
            enum:
            - pending
            - approved
            - rejected
          relationshipId:
            type: string
            format: uuid
            nullable: true
            description: Relación afectada; en un alta aprobada apunta a la relación creada.
          relationTypeId:
            type: string
            format: uuid
            nullable: true
          sourceElementId:
            type: string
            format: uuid
            nullable: true
          targetElementId:
            type: string
            format: uuid
            nullable: true
          justification:
            type: string
          decision:
            $ref: '#/components/schemas/ProposalDecision'
      - $ref: '#/components/schemas/AuditStamp'
    ProposalPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/RelationshipProposal'
    AuditChange:
      type: object
      required:
      - field
      properties:
        field:
          type: string
          example: Criticidad
        oldValue:
          anyOf:
          - type: string
            nullable: true
          - type: number
            nullable: true
        newValue:
          anyOf:
          - type: string
            nullable: true
          - type: number
            nullable: true
    AuditEntry:
      type: object
      required:
      - id
      - occurredAt
      - actorId
      - action
      - objectType
      - objectId
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        actorId:
          type: string
          format: uuid
        action:
          type: string
          example: element.updated
        objectType:
          type: string
        objectId:
          type: string
          format: uuid
        changes:
          type: array
          items:
            $ref: '#/components/schemas/AuditChange'
    AuditEntryPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/AuditEntry'
    DemoDataset:
      type: object
      required:
      - alreadyLoaded
      - layers
      - elements
      - relationships
      properties:
        alreadyLoaded:
          type: boolean
        layers:
          type: integer
        elements:
          type: integer
        relationships:
          type: integer
