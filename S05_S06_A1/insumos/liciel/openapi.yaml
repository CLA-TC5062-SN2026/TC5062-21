        in: query
        description: Propuestas de cambio o retiro de una relación.
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Página de propuestas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - relationship-proposals
      operationId: createRelationshipProposal
      summary: Proponer el alta, el cambio o el retiro de una relación
      description: |
        Crea una propuesta **pendiente**; no modifica el mapa ni la relación vigente hasta la decisión.
        - `kind=create`: alta entre dos elementos activos con un tipo de relación compatible.
        - `kind=change`: cambia justificación, tipo o extremos de una relación vigente (conserva su identificador). Si cambia el origen, se exige permiso en la capa del origen vigente y del nuevo.
        - `kind=retire`: solicita retirar una relación vigente.
        La justificación (10 a 500 caracteres) es obligatoria. Un administrador también puede proponer, pero decide en una operación aparte.
      x-acceptance-criteria:
      - RF-10-AC-1
      - RF-10-AC-2
      - RF-10-AC-3
      - RF-12-AC-1
      - RF-12-AC-3
      - RF-16-AC-3
      x-required-roles:
      - admin
      - editor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposalCreate'
      responses:
        '201':
          description: Propuesta registrada en estado `pending`.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipProposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Duplicado de relación validada no retirada o de propuesta pendiente (`DUPLICATE_RELATIONSHIP`), o ya hay una propuesta pendiente sobre la misma relación (`PROPOSAL_ALREADY_PENDING`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Referencia inexistente en el cuerpo (extremo, tipo de relación o relación a cambiar/retirar), extremo dado de baja o de tipo incompatible, relación de un elemento consigo mismo, o justificación fuera de 10 a 500 caracteres.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /relationship-proposals/{proposalId}:
    parameters:
    - $ref: '#/components/parameters/ProposalId'
    get:
      tags:
      - relationship-proposals
      operationId: getRelationshipProposal
      summary: Consultar una propuesta
      description: Incluye estado, decisor, fecha de decisión y comentario cuando ya fue resuelta.
      x-acceptance-criteria:
      - RF-10-AC-1
      - RF-11-AC-1
      - RF-11-AC-2
      - RF-19-AC-2
      x-required-roles:
      - admin
      - editor
      responses:
        '200':
          description: Propuesta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipProposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
      - relationship-proposals
      operationId: decideRelationshipProposal
      summary: Aprobar o rechazar una propuesta (transición de estado)
      description: |
        Cambia el estado de `pending` a `approved` o `rejected` y registra la decisión (actor y fecha). Al **aprobar** se revalidan extremos activos, compatibilidad del tipo y ausencia de duplicados;
        si alguna regla falla responde 409, la propuesta sigue pendiente y la relación vigente no cambia.
        Aprobar un alta crea la relación vigente; aprobar un cambio actualiza la relación conservando su identificador; aprobar un retiro la deja `retired`.
        Rechazar conserva exactamente la versión anterior. Una propuesta ya decidida no puede decidirse otra vez (409).
      x-acceptance-criteria:
      - RF-11-AC-1
      - RF-11-AC-2
      - RF-11-AC-3
      - RF-12-AC-2
      - RF-12-AC-3
      - RF-12-AC-4
      x-required-roles:
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProposalDecisionWrite'
      responses:
        '200':
          description: Propuesta resuelta, con decisor, fecha y comentario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipProposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La propuesta ya fue decidida (`PROPOSAL_NOT_PENDING`) o falla la revalidación al aprobar (`PROPOSAL_REVALIDATION_FAILED`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /audit-entries:
