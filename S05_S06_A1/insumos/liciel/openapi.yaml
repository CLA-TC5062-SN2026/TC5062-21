openapi: 3.0.3
info:
  title: API de la Plataforma de Arquitectura Empresarial
  version: 1.0.0
  description: |
    Contrato **spec-first** de la API REST del backend de la Plataforma de Arquitectura Empresarial (Equipo 21).
    Deriva de `SRS_equipo.md` v1.0 (19 RF, 56 criterios de aceptación) y de `backlog.md` (US-01 a US-21).

    **Convenciones**
    - Recursos en sustantivos, plural, minúsculas y kebab-case. Versionado por prefijo de ruta (`/api/v1`).
    - Autenticación con JWT Bearer. Cada JWT lleva un identificador de sesión (`sid`); el servidor lo comprueba en
      cada petición, de modo que cerrar una sesión, cambiar el rol, desactivar o restablecer una cuenta invalida el token.
      Las sesiones expiran a las 8 h o tras 30 min de inactividad (RNF-03).
    - Errores en `application/problem+json` (RFC 7807) con un `code` estable y, si aplica, `errors[]` por campo.
    - Criterio de códigos de error: **400** petición mal formada; **401** sin sesión válida; **403** sin permiso por rol o capa;
      **404** recurso inexistente; **409** conflicto con el estado actual (duplicados, tipo en uso, último administrador,
      propuesta simultánea, revalidación fallida); **422** regla de negocio o validación de valores incumplida; **412/428** falta o no coincide `If-Match`; **429** limitación de frecuencia; **500** error interno. Además, el servidor responde **405** (con `Allow`) a métodos no expuestos y **415** si el cuerpo no es `application/json`.
    - Concurrencia optimista: los `GET` de un recurso devuelven `ETag`; `PATCH` y `PUT` sobre recursos mutables exigen `If-Match`.
    - Las respuestas que entregan secretos (token, contraseñas) llevan `Cache-Control: no-store`.
    - Listados paginados: páginas fijas de 25. Los catálogos acotados (capas, tipos de elemento y de relación) se devuelven completos.
    - Todo rechazo es atómico: no deja cambios parciales (RNF-05).
    - La extensión `x-acceptance-criteria` lista los IDs `RF-XX-AC-Y` del SRS que cada operación satisface;
      `x-required-roles` indica los roles autorizados (el Editor además queda limitado a sus capas asignadas en escrituras).
    - Sin borrado físico: no existe ningún `DELETE` sobre datos de negocio (RD-05). El único `DELETE` cierra una sesión.
    - Los códigos de respuesta se escriben en inglés (`admin`, `editor`, `viewer`, `active`, `inactive`, `retired`); la
      correspondencia con los términos del SRS está en `decisiones_y_trazabilidad.md`.
  contact:
    name: Equipo 21 — TC5062
servers:
- url: https://api.arquitectura.example.com/api/v1
  description: Servidor desplegado (HTTPS obligatorio, RNF-03)
- url: http://localhost:8000/api/v1
  description: Desarrollo local
tags:
- name: auth
  description: Sesiones (inicio y cierre)
- name: users
  description: Cuentas, roles y capas editables
- name: layers
  description: Capas del modelo
- name: element-types
  description: Tipos de elemento y sus campos
- name: elements
  description: Elementos, búsqueda, baja lógica y mapa de relaciones
- name: relation-types
  description: Tipos de relación dirigidos
- name: relationships
  description: Relaciones validadas
- name: relationship-proposals
  description: Propuestas de alta, cambio o retiro y su decisión
- name: audit
  description: Bitácora de solo lectura
- name: demo-data
  description: Datos ficticios de demostración
security:
- bearerAuth: []
paths:
  /auth/sessions:
    post:
      tags:
      - auth
      operationId: createSession
      summary: Iniciar sesión (crea una sesión)
      description: Autentica una cuenta activa con credenciales locales. No requiere token.
      security: []
      x-acceptance-criteria:
      - RF-01-AC-1
      - RF-01-AC-2
      x-required-roles:
      - public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '201':
          description: Sesión creada; se informa el rol de la cuenta.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Credenciales incorrectas o cuenta desactivada. No se crea sesión ni se entregan datos.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/sessions/current:
    delete:
      tags:
      - auth
      operationId: closeCurrentSession
      summary: Cerrar la sesión actual
      description: Invalida únicamente la sesión usada en la petición; las demás sesiones de la cuenta siguen válidas.
      x-acceptance-criteria:
      - RF-01-AC-3
      x-required-roles:
      - admin
      - editor
      - viewer
      responses:
        '204':
          description: Sesión cerrada.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /users:
    get:
      tags:
      - users
      operationId: listUsers
      summary: Listar cuentas
      x-acceptance-criteria:
      - RF-02-AC-1
      - RF-19-AC-2
      x-required-roles:
      - admin
      parameters:
      - name: role
        in: query
        schema:
          $ref: '#/components/schemas/Role'
      - name: isActive
        in: query
        schema:
          type: boolean
      - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Página de cuentas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - users
      operationId: createUser
      summary: Crear una cuenta
      description: |
        Crea una cuenta con un único rol. Para un Editor se pueden indicar las capas editables.
        La contraseña inicial la genera el servidor y **solo se devuelve en esta respuesta** (RNF-01).
      x-acceptance-criteria:
      - RF-02-AC-1
      x-required-roles:
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Cuenta creada.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/me:
    get:
      tags:
      - users
      operationId: getCurrentUser
      summary: Consultar la cuenta de la sesión actual
      description: Permite al frontend recuperar rol y capas editables al abrir una sesión nueva.
      x-acceptance-criteria:
      - RF-01-AC-1
      - RF-19-AC-2
      x-required-roles:
      - admin
      - editor
      - viewer
      responses:
        '200':
          description: Cuenta actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/{userId}:
    parameters:
    - $ref: '#/components/parameters/UserId'
    get:
      tags:
      - users
      operationId: getUser
      summary: Consultar una cuenta
      x-acceptance-criteria:
      - RF-02-AC-1
      - RF-19-AC-2
      x-required-roles:
      - admin
      responses:
        '200':
          description: Cuenta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
      - users
      operationId: updateUser
      summary: Cambiar rol, nombre o estado de una cuenta
      description: |
        Actualización parcial. Cambiar `role` o poner `isActive=false` invalida todas las sesiones de la cuenta afectada.
        No puede quedar el sistema sin un administrador activo (409).
      x-acceptance-criteria:
      - RF-02-AC-2
      - RF-02-AC-3
      - RF-02-AC-4
      x-required-roles:
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Cuenta actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/IfMatch'
  /users/{userId}/editable-layers:
    parameters:
    - $ref: '#/components/parameters/UserId'
    get:
      tags:
      - users
      operationId: getEditableLayers
      summary: Consultar las capas editables de un Editor
      x-acceptance-criteria:
      - RF-02-AC-1
      - RF-19-AC-2
      x-required-roles:
      - admin
      responses:
        '200':
          description: Capas asignadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditableLayers'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
      - users
      operationId: replaceEditableLayers
      summary: Reemplazar el conjunto de capas editables de un Editor
      description: Idempotente. Un Editor sin capas asignadas conserva la consulta y no puede escribir.
      x-acceptance-criteria:
      - RF-02-AC-1
      - RF-06-AC-3
      x-required-roles:
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditableLayers'
      responses:
        '200':
          description: Conjunto de capas actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditableLayers'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          description: La cuenta no es Editor o alguna capa no existe.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/IfMatch'
  /users/{userId}/password-resets:
    parameters:
    - $ref: '#/components/parameters/UserId'
    post:
      tags:
      - users
      operationId: createPasswordReset
      summary: Restablecer las credenciales de una cuenta
      description: |
        Genera una contraseña temporal (se devuelve una sola vez), invalida las credenciales anteriores y todas las
        sesiones de la cuenta. La bitácora registra el evento sin contraseñas (RF-18-AC-3).
      x-acceptance-criteria:
      - RF-02-AC-4
      - RF-18-AC-3
      x-required-roles:
      - admin
      responses:
        '200':
          description: Restablecimiento realizado; la contraseña temporal se entrega una sola vez.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetCreated'
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /layers:
    get:
      tags:
      - layers
      operationId: listLayers
      summary: Listar capas
      description: Incluye Negocio, Datos, Aplicaciones y Tecnología más las que cree el administrador.
      x-acceptance-criteria:
      - RF-03-AC-1
      - RF-19-AC-1
      x-required-roles:
      - admin
      - editor
      - viewer
      responses:
        '200':
          description: Todas las capas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayerList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - layers
      operationId: createLayer
      summary: Crear una capa
      description: El nombre es único globalmente, sin distinguir mayúsculas ni espacios extremos.
      x-acceptance-criteria:
      - RF-03-AC-1
      - RF-03-AC-2
      - RF-03-AC-3
      x-required-roles:
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LayerWrite'
      responses:
        '201':
          description: Capa creada; disponible sin reiniciar.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Layer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
  /layers/{layerId}:
    parameters:
    - $ref: '#/components/parameters/LayerId'
    get:
      tags:
      - layers
      operationId: getLayer
      summary: Consultar una capa
      x-acceptance-criteria:
      - RF-03-AC-1
      - RF-19-AC-1
      x-required-roles:
      - admin
      - editor
      - viewer
      responses:
        '200':
          description: Capa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Layer'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
      - layers
      operationId: renameLayer
      summary: Renombrar una capa
      x-acceptance-criteria:
      - RF-03-AC-2
      - RF-03-AC-3
      x-required-roles:
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LayerWrite'
      responses:
        '200':
          description: Capa renombrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Layer'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/IfMatch'
  /element-types:
    get:
      tags:
      - element-types
      operationId: listElementTypes
      summary: Listar tipos de elemento
      x-acceptance-criteria:
      - RF-04-AC-1
      - RF-19-AC-1
      x-required-roles:
      - admin
      - editor
      - viewer
      parameters:
      - name: layerId
        in: query
        description: Limita a los tipos de una capa.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Tipos de elemento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElementTypeList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - element-types
      operationId: createElementType
      summary: Crear un tipo de elemento en una capa
      x-acceptance-criteria:
      - RF-04-AC-1
      - RF-04-AC-3
      x-required-roles:
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElementTypeCreate'
      responses:
        '201':
          description: Tipo creado y asociado a su capa.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElementType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: La capa indicada no existe u otra validación falla; no se crea un tipo huérfano.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /element-types/{elementTypeId}:
    parameters:
    - $ref: '#/components/parameters/ElementTypeId'
    get:
      tags:
      - element-types
      operationId: getElementType
      summary: Consultar un tipo de elemento
      x-acceptance-criteria:
      - RF-04-AC-1
      - RF-19-AC-1
      x-required-roles:
      - admin
      - editor
      - viewer
      responses:
        '200':
          description: Tipo de elemento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElementType'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
      - element-types
      operationId: renameElementType
      summary: Renombrar un tipo de elemento
      description: Conserva identificador, campos y elementos asociados.
      x-acceptance-criteria:
      - RF-04-AC-2
      x-required-roles:
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElementTypeRename'
      responses:
        '200':
          description: Tipo renombrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElementType'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - $ref: '#/components/parameters/IfMatch'
  /element-types/{elementTypeId}/fields:
    parameters:
    - $ref: '#/components/parameters/ElementTypeId'
    get:
      tags:
      - element-types
      operationId: listFields
      summary: Consultar los campos de un tipo
      description: Devuelve los campos adicionales; el campo base `Nombre` (texto, obligatorio) es implícito en todo tipo.
      x-acceptance-criteria:
      - RF-05-AC-1
      - RF-19-AC-1
      x-required-roles:
      - admin
      - editor
      - viewer
      responses:
        '200':
          description: Definición de campos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldSet'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
      - element-types
      operationId: replaceFields
      summary: Definir el conjunto de campos de un tipo sin elementos
      description: |
        Reemplaza la definición completa (idempotente). Si el tipo ya tiene elementos no se pueden agregar, retirar
        ni cambiar campos, tipos de dato, obligatoriedad u opciones (409). Los nombres son únicos dentro del tipo,
        sin distinguir mayúsculas ni espacios extremos, y no pueden repetir el campo base `Nombre`.
      x-acceptance-criteria:
      - RF-05-AC-1
      - RF-05-AC-2
      - RF-05-AC-3
      x-required-roles:
      - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldSetWrite'
      responses:
        '200':
          description: Campos guardados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FieldSet'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
