  /relationship-proposals:
    get:
      tags:
      - relationship-proposals
      operationId: listRelationshipProposals
      summary: Listar propuestas de relación
      description: El administrador ve todas; un Editor ve las que él registró; Consulta no tiene acceso.
      x-acceptance-criteria:
      - RF-10-AC-1
      - RF-11-AC-1
      - RF-19-AC-2
      x-required-roles:
      - admin
      - editor
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
