        persistida, sin duplicar configuración, elementos, propuestas ni decisiones.'
      x-retry-policy: Consultar GET /cargas-demostracion/muestra-v1 tras respuesta perdida; repetir la misma clave
        es seguro por la restricción persistida. No reaprueba ni recrea una muestra modificada después.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT de sesión local persistida; sid/sub vinculados. Comprobar estado, expiración, inactividad
        y permisos actuales en cada operación.
  parameters:
    Pagina:
      name: pagina
      in: query
      description: Página de 25 registros; una página fuera del total devuelve items vacíos.
      schema:
        type: integer
        minimum: 1
        default: 1
    IncluirBajas:
      name: incluir-bajas
      in: query
      description: Incluye elementos dados de baja, etiquetados activo=false; no modifica el mapa ordinario.
      schema:
        type: boolean
        default: false
    NombreBusqueda:
      name: nombre
      in: query
      description: 'Omitido: listado. Presente: búsqueda parcial por nombre, recorta espacios, ignora mayúsculas
        y distingue acentos. Vacío/blanco: 422; la interfaz debe detectarlo antes de enviar la petición.'
      schema:
        type: string
        minLength: 1
        pattern: \S
  responses:
    SolicitudMalformada:
      description: JSON malformado o sintaxis de consulta inválida. Código MALFORMADO; no altera datos.
      headers:
        Cache-Control:
          description: No almacenar datos protegidos ni tokens.
          schema:
            type: string
            enum:
            - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoAutenticado:
      description: Credenciales inválidas, cuenta inactiva o Bearer ausente, inválido, expirado o revocado. Código
        NO_AUTENTICADO; no entrega datos protegidos.
      headers:
        Cache-Control:
          description: No almacenar datos protegidos ni tokens.
          schema:
            type: string
            enum:
            - no-store
        WWW-Authenticate:
          description: Desafío Bearer; para credenciales de inicio fallidas también se utiliza el mismo tipo de
            desafío.
          schema:
            type: string
          example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoAutorizado:
      description: Sesión válida sin rol o permiso de capa requerido. Código NO_AUTORIZADO; no altera datos.
      headers:
        Cache-Control:
          description: No almacenar datos protegidos ni tokens.
          schema:
            type: string
            enum:
            - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoEncontrado:
      description: Recurso solicitado inexistente o elemento dado de baja oculto por defecto. Código NO_ENCONTRADO.
      headers:
        Cache-Control:
          description: No almacenar datos protegidos ni tokens.
          schema:
            type: string
            enum:
            - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflicto:
      description: 'Conflicto con el estado persistido: duplicado, estructura bloqueada, último administrador o
        propuesta ya resuelta/pendiente. Código específico en el cuerpo. No altera estado.'
      headers:
        Cache-Control:
          description: No almacenar datos protegidos ni tokens.
          schema:
            type: string
            enum:
            - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Validacion:
      description: JSON bien formado con valores inválidos, campo requerido vacío, fecha imposible, referencia del
        cuerpo inexistente, extremos inactivos/incompatibles o filtro incoherente. Código VALIDACION con detalles
        por campo. Operación atómica.
      headers:
        Cache-Control:
          description: No almacenar datos protegidos ni tokens.
          schema:
            type: string
            enum:
            - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ErrorInterno:
      description: Error interno; código ERROR_INTERNO sin trazas ni secretos. Una operación no confirmada se revierte
        por completo.
      headers:
        Cache-Control:
          description: No almacenar datos protegidos ni tokens.
          schema:
            type: string
            enum:
            - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TipoContenidoNoSoportado:
      description: 'Content-Type distinto de application/json para una operación con cuerpo. Código TIPO_CONTENIDO_NO_SOPORTADO;
        devuelve 415 sin aplicar cambios. Cuerpo ausente con tipo esperado o JSON malformado se distingue: 422 para
        cuerpo requerido ausente, 400 para JSON malformado.'
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
            - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ErrorDetalle:
      type: object
      additionalProperties: false
      properties:
        campo:
          type: string
        codigo:
          type: string
        mensaje:
          type: string
      required:
      - codigo
      - mensaje
    Error:
      type: object
      additionalProperties: false
      properties:
        codigo:
          type: string
        mensaje:
          type: string
          description: Mensaje en español, sin secretos ni detalles internos.
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetalle'
      required:
      - codigo
      - mensaje
      - detalles
    MetadatosPagina:
      type: object
      additionalProperties: false
      properties:
        pagina:
          type: integer
          minimum: 1
        tamanoPagina:
          type: integer
          enum:
          - 25
        total:
          type: integer
          minimum: 0
        totalPaginas:
          type: integer
          minimum: 0
      required:
      - pagina
      - tamanoPagina
      - total
      - totalPaginas
    ReferenciaCuenta:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        usuario:
          type: string
      required:
      - id
      - usuario
    Autoria:
      type: object
      additionalProperties: false
      properties:
        creador:
          $ref: '#/components/schemas/ReferenciaCuenta'
        creadoEn:
          type: string
          format: date-time
        ultimoModificador:
          $ref: '#/components/schemas/ReferenciaCuenta'
        modificadoEn:
          type: string
          format: date-time
      required:
      - creador
      - creadoEn
      - ultimoModificador
      - modificadoEn
    Cuenta:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        usuario:
          type: string
        rol:
          type: string
          enum:
          - ADMINISTRADOR
          - EDITOR
          - CONSULTA
        activa:
          type: boolean
        capasEditables:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
          description: Vacía para roles distintos de EDITOR; ADMINISTRADOR tiene facultad global sin asignaciones.
      required:
      - id
      - usuario
      - rol
      - activa
      - capasEditables
    CuentaCrear:
      type: object
      additionalProperties: false
      properties:
        usuario:
          type: string
          minLength: 1
          pattern: \S
          description: Se recortan espacios extremos; unicidad sin distinguir mayúsculas en el ámbito del SRS. Los
            nombres de elementos sí pueden repetirse.
        contrasena:
          type: string
          minLength: 1
          writeOnly: true
          description: Se recibe por HTTPS; nunca se devuelve ni se registra en la bitácora. La política de fortaleza
            es una decisión pendiente del equipo, no un requisito agregado al SRS.
        rol:
          type: string
          enum:
          - ADMINISTRADOR
          - EDITOR
          - CONSULTA
        capasEditables:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
          default: []
      description: Cuenta activa inicialmente. Usuario único sin mayúsculas/espacios extremos. Capas solo para EDITOR,
        existentes y sin duplicados; no se provisiona el primer administrador con esta operación.
      required:
      - usuario
      - contrasena
      - rol
    CuentaActualizar:
      type: object
      additionalProperties: false
      properties:
        rol:
          type: string
          enum:
          - ADMINISTRADOR
          - EDITOR
          - CONSULTA
        activa:
          type: boolean
      minProperties: 1
      description: PATCH parcial. Rol distinto de EDITOR limpia asignaciones. Un cambio efectivo de rol o desactivación
        revoca todas sus sesiones. No permite dejar cero administradores activos.
    Asignaciones:
      type: object
      additionalProperties: false
      properties:
        capasEditables:
          type: array
          items:
            type: string
            format: uuid
          uniqueItems: true
      description: Sustitución completa, solo para cuentas EDITOR; [] retira todas. Las autorizaciones leen las
        asignaciones vigentes en cada solicitud.
      required:
      - capasEditables
    Credenciales:
      type: object
      additionalProperties: false
      properties:
        contrasena:
          type: string
          minLength: 1
          writeOnly: true
          description: Se recibe por HTTPS; nunca se devuelve ni se registra en la bitácora. La política de fortaleza
            es una decisión pendiente del equipo, no un requisito agregado al SRS.
      required:
      - contrasena
    SesionCrear:
      type: object
      additionalProperties: false
      properties:
        usuario:
          type: string
          minLength: 1
        contrasena:
          type: string
          minLength: 1
          writeOnly: true
          description: Se recibe por HTTPS; nunca se devuelve ni se registra en la bitácora. La política de fortaleza
            es una decisión pendiente del equipo, no un requisito agregado al SRS.
      required:
      - usuario
      - contrasena
    Sesion:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        cuenta:
          $ref: '#/components/schemas/Cuenta'
        iniciadaEn:
          type: string
          format: date-time
        ultimaActividadEn:
          type: string
          format: date-time
        expiraEn:
          type: string
          format: date-time
      description: Expiración absoluta de 8 horas; inactividad de 30 minutos. Todo acceso protegido válido actualiza
        ultimaActividadEn sin extender expiraEn.
      required:
      - id
      - cuenta
      - iniciadaEn
      - ultimaActividadEn
      - expiraEn
    SesionCreada:
      type: object
      additionalProperties: false
      properties:
        accessToken:
          type: string
          description: JWT firmado con sub=cuenta.id, sid=sesion.id, iat y exp. Verificar firma, sesión persistida,
            cuenta activa y permisos vigentes en cada solicitud.
        tokenType:
          type: string
          enum:
          - Bearer
        sesion:
          $ref: '#/components/schemas/Sesion'
      required:
      - accessToken
      - tokenType
      - sesion
    SesionCerrada:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        revocada:
          type: boolean
          enum:
          - true
      required:
      - id
      - revocada
    ResultadoCredenciales:
      type: object
      additionalProperties: false
      properties:
        cuentaId:
          type: string
          format: uuid
        sesionesRevocadas:
          type: boolean
          enum:
          - true
      required:
      - cuentaId
      - sesionesRevocadas
    CapaCrear:
      type: object
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 1
          pattern: \S
          description: Se recortan espacios extremos; unicidad sin distinguir mayúsculas en el ámbito del SRS. Los
            nombres de elementos sí pueden repetirse.
        descripcion:
          type: string
          default: ''
      required:
      - nombre
    CapaActualizar:
      type: object
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 1
          pattern: \S
          description: Se recortan espacios extremos; unicidad sin distinguir mayúsculas en el ámbito del SRS. Los
            nombres de elementos sí pueden repetirse.
        descripcion:
          type: string
      minProperties: 1
    Capa:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        descripcion:
          type: string
      required:
      - id
      - nombre
      - descripcion
    TipoElementoCrear:
      type: object
      additionalProperties: false
      properties:
        capaId:
          type: string
          format: uuid
        nombre:
          type: string
          minLength: 1
          pattern: \S
          description: Se recortan espacios extremos; unicidad sin distinguir mayúsculas en el ámbito del SRS. Los
            nombres de elementos sí pueden repetirse.
        descripcion:
          type: string
          default: ''
      description: Nombre único dentro de la capa. Crea automáticamente un campo Nombre, texto, obligatorio e inalterable.
      required:
      - capaId
      - nombre
    TipoElementoActualizar:
      type: object
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 1
          pattern: \S
          description: Se recortan espacios extremos; unicidad sin distinguir mayúsculas en el ámbito del SRS. Los
            nombres de elementos sí pueden repetirse.
        descripcion:
          type: string
      minProperties: 1
      description: No cambia capaId, campos, identificador ni asociaciones de elementos.
    TipoElemento:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        capaId:
          type: string
          format: uuid
        nombre:
          type: string
        descripcion:
          type: string
        estructuraBloqueada:
          type: boolean
          description: Verdadero si tiene cualquier elemento, incluso dado de baja.
      required:
      - id
      - capaId
      - nombre
      - descripcion
      - estructuraBloqueada
    OpcionSeleccion:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        etiqueta:
          type: string
          minLength: 1
          pattern: \S
          description: Se recortan espacios extremos; unicidad sin distinguir mayúsculas en el ámbito del SRS. Los
            nombres de elementos sí pueden repetirse.
      required:
      - id
      - etiqueta
    CampoGuardar:
      type: object
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 1
          pattern: \S
          description: Se recortan espacios extremos; unicidad sin distinguir mayúsculas en el ámbito del SRS. Los
            nombres de elementos sí pueden repetirse.
        tipoDato:
          type: string
          enum:
          - TEXTO
          - NUMERO
          - FECHA
          - SELECCION
        obligatorio:
          type: boolean
        opciones:
          type: array
          items:
            type: string
            minLength: 1
            pattern: \S
            description: Se recortan espacios extremos; unicidad sin distinguir mayúsculas en el ámbito del SRS.
              Los nombres de elementos sí pueden repetirse.
          uniqueItems: true
          default: []
      description: SELECCION requiere al menos una opción distinta al normalizar; otros tipos requieren opciones
        vacías. El servidor asigna UUID a las opciones. No se altera Nombre ni una estructura bloqueada.
      required:
      - nombre
      - tipoDato
      - obligatorio
    Campo:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        tipoElementoId:
          type: string
          format: uuid
        nombre:
          type: string
        tipoDato:
          type: string
          enum:
          - TEXTO
          - NUMERO
          - FECHA
          - SELECCION
        obligatorio:
          type: boolean
        esNombreBase:
          type: boolean
        retirado:
          type: boolean
          description: Retiro lógico solo antes de que exista un elemento; conserva identidad e historial de la
            definición.
        opciones:
          type: array
          items:
            $ref: '#/components/schemas/OpcionSeleccion'
      required:
      - id
      - tipoElementoId
      - nombre
      - tipoDato
      - obligatorio
      - esNombreBase
      - retirado
      - opciones
    ValorTexto:
      type: object
      additionalProperties: false
      properties:
        campoId:
          type: string
          format: uuid
        tipoDato:
          type: string
          enum:
          - TEXTO
        valor:
          type: string
      description: La definición debe pertenecer al tipo del elemento y coincidir con tipoDato. La opción debe pertenecer
        al campo; las fechas deben existir en el calendario.
      required:
      - campoId
      - tipoDato
      - valor
    ValorNumero:
      type: object
      additionalProperties: false
      properties:
        campoId:
          type: string
          format: uuid
        tipoDato:
          type: string
          enum:
          - NUMERO
        valor:
          type: number
      description: La definición debe pertenecer al tipo del elemento y coincidir con tipoDato. La opción debe pertenecer
        al campo; las fechas deben existir en el calendario.
      required:
      - campoId
      - tipoDato
      - valor
    ValorFecha:
      type: object
      additionalProperties: false
      properties:
        campoId:
          type: string
          format: uuid
        tipoDato:
          type: string
          enum:
          - FECHA
        valor:
          type: string
          format: date
      description: La definición debe pertenecer al tipo del elemento y coincidir con tipoDato. La opción debe pertenecer
        al campo; las fechas deben existir en el calendario.
      required:
      - campoId
      - tipoDato
      - valor
    ValorSeleccion:
      type: object
      additionalProperties: false
      properties:
        campoId:
          type: string
          format: uuid
        tipoDato:
          type: string
          enum:
          - SELECCION
        opcionId:
          type: string
          format: uuid
      description: La definición debe pertenecer al tipo del elemento y coincidir con tipoDato. La opción debe pertenecer
        al campo; las fechas deben existir en el calendario.
      required:
      - campoId
      - tipoDato
      - opcionId
    ValorCampo:
      oneOf:
      - $ref: '#/components/schemas/ValorTexto'
      - $ref: '#/components/schemas/ValorNumero'
      - $ref: '#/components/schemas/ValorFecha'
      - $ref: '#/components/schemas/ValorSeleccion'
      discriminator:
        propertyName: tipoDato
        mapping:
          TEXTO: '#/components/schemas/ValorTexto'
          NUMERO: '#/components/schemas/ValorNumero'
          FECHA: '#/components/schemas/ValorFecha'
          SELECCION: '#/components/schemas/ValorSeleccion'
      description: Representación de las cuatro subclases del modelo S04_A1. No admite null ni pares campoId duplicados;
        un opcional vacío no tiene entrada. Los obligatorios se comprueban con la definición dinámica en el servidor.
    EliminarValor:
      type: object
      additionalProperties: false
      properties:
        campoId:
          type: string
          format: uuid
        eliminar:
          type: boolean
          enum:
          - true
      description: Solo en PATCH y para campos opcionales. Retira su valor sin retirar la definición.
      required:
      - campoId
      - eliminar
    ElementoCrear:
      type: object
      additionalProperties: false
      properties:
        tipoElementoId:
          type: string
          format: uuid
        valores:
          type: array
          items:
            $ref: '#/components/schemas/ValorCampo'
          minItems: 1
      description: Incluye todos los obligatorios y solo los opcionales con valor. Nombre se obtiene del campo base;
        texto obligatorio vacío o de espacios produce 422. Escritura y bitácora atómicas.
      required:
      - tipoElementoId
      - valores
    ElementoActualizar:
      type: object
      additionalProperties: false
      properties:
        valores:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/ValorCampo'
            - $ref: '#/components/schemas/EliminarValor'
          minItems: 1
      description: Solo modifica los campos enviados; los omitidos se conservan. Un campo no puede repetirse. Valida
        el conjunto final completo antes de confirmar; no cambia identidad ni tipo/capa.
      required:
      - valores
    ElementoResumen:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        tipoElementoId:
          type: string
          format: uuid
        tipoElementoNombre:
          type: string
        capaId:
          type: string
          format: uuid
        capaNombre:
          type: string
        activo:
          type: boolean
      required:
      - id
      - nombre
      - tipoElementoId
      - tipoElementoNombre
      - capaId
      - capaNombre
      - activo
    Elemento:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          description: Derivado del valor del campo base Nombre, no se escribe por separado.
        tipoElementoId:
          type: string
          format: uuid
        tipoElementoNombre:
          type: string
        capaId:
          type: string
          format: uuid
        capaNombre:
          type: string
        activo:
          type: boolean
        valores:
          type: array
          items:
            $ref: '#/components/schemas/ValorCampo'
        autoria:
          $ref: '#/components/schemas/Autoria'
      required:
      - id
      - nombre
      - tipoElementoId
      - tipoElementoNombre
      - capaId
      - capaNombre
      - activo
      - valores
      - autoria
    EstadoElemento:
      type: object
      additionalProperties: false
      properties:
        activo:
          type: boolean
      description: PUT completo del subrecurso estado. false da de baja, true reactiva; no elimina campos, relaciones
        ni historial. Repetir el mismo estado no genera otra transición ni bitácora de cambio.
      required:
      - activo
    TipoRelacionGuardar:
      type: object
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 1
          pattern: \S
          description: Se recortan espacios extremos; unicidad sin distinguir mayúsculas en el ámbito del SRS. Los
            nombres de elementos sí pueden repetirse.
        descripcion:
          type: string
        tipoOrigenId:
          type: string
          format: uuid
        tipoDestinoId:
          type: string
          format: uuid
      required:
      - nombre
      - descripcion
      - tipoOrigenId
      - tipoDestinoId
    TipoRelacionActualizar:
      type: object
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 1
          pattern: \S
          description: Se recortan espacios extremos; unicidad sin distinguir mayúsculas en el ámbito del SRS. Los
            nombres de elementos sí pueden repetirse.
        descripcion:
          type: string
      minProperties: 1
      description: Los tipos de los extremos son inmutables en esta versión para conservar compatibilidad de relaciones
        existentes. Para otra combinación se crea una definición nueva.
    TipoRelacion:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
        descripcion:
          type: string
        tipoOrigenId:
          type: string
          format: uuid
        tipoDestinoId:
          type: string
          format: uuid
      required:
      - id
      - nombre
      - descripcion
      - tipoOrigenId
      - tipoDestinoId
    Relacion:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        origenId:
          type: string
          format: uuid
        destinoId:
          type: string
          format: uuid
        tipoRelacionId:
          type: string
