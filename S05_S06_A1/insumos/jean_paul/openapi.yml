paths:
  /sesiones:
    post:
      tags:
      - Sesiones
      operationId: crearSesion
      summary: Iniciar sesión
      description: Credenciales locales de una cuenta activa. Error genérico idéntico para usuario inexistente,
        contraseña incorrecta o cuenta inactiva. No autorregistro. JWT y metadatos no deben almacenarse en caché.
      x-acceptance-criteria:
      - RF-01-AC-1
      - RF-01-AC-2
      - RF-02-AC-1
      - RF-02-AC-2
      - RF-02-AC-4
      x-roles: []
      responses:
        '201':
          description: Iniciar sesión. Recurso creado y persistido.
          headers:
            Cache-Control:
              description: No almacenar datos protegidos ni tokens.
              schema:
                type: string
                enum:
                - no-store
            Location:
              description: 'Location: /api/v1/sesiones/actual, consultable con el JWT devuelto. Es una referencia
                a la sesión recién creada, relativa al actor autenticado.'
              schema:
                type: string
                format: uri-reference
              x-resource-path: /sesiones/actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionCreada'
        '400':
          $ref: '#/components/responses/SolicitudMalformada'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '422':
          $ref: '#/components/responses/Validacion'
