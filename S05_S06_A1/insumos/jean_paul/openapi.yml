# S04_A2 — Contrato revisado en Parte 2; no implica backend implementado.
openapi: 3.0.3
info:
  title: Plataforma de Arquitectura Empresarial — API del equipo 21
  version: 1.1.0
  description: |
    Contrato spec-first de S04_A2, revisado en Parte 2. Autor: Jean Paul Lozano Gámiz (A01840432), con apoyo del agente.
    Línea base: SRS_equipo v1.0 (1 de octubre de 2026), 19 RF y 56 criterios canónicos; diagramas revisados S04_A1. La implementación FastAPI/PostgreSQL y sus pruebas deberán derivarse de este contrato. No es una API implementada ni certifica pruebas de rendimiento, persistencia o interfaz.
    Las contraseñas se almacenarán con hash resistente y sal, nunca en texto legible ni en registros. JWT autentica una sesión persistida: verificar firma, sid/sub, cuenta activa, revocación, expiración absoluta de 8 h e inactividad de 30 min; nunca autorizar solo con claims de rol. Los permisos se consultan en el servidor por solicitud. Una respuesta 403 no cambia datos; un cambio de rol, desactivación o restablecimiento revoca todas las sesiones de esa cuenta; el cierre revoca solo la sesión actual. HTTPS obligatorio en despliegue.
    Todos los usuarios autenticados consultan datos activos. ADMINISTRADOR configura y administra; EDITOR escribe elementos en sus capas y propone relaciones desde un origen editable; CONSULTA no escribe. EDITOR sin capas solo consulta. Cuenta y Sesion conservan autoría histórica aunque la cuenta se desactive. El primer administrador y las cuatro capas base se provisionan durante instalación.
    Toda escritura y su bitácora se confirman en la misma transacción. Comprobar restricciones bajo concurrencia (unicidad, último administrador, estructura bloqueada, propuesta pendiente/decisión única) con bloqueo y restricciones persistentes; los rechazos no dejan cambios parciales. La API devuelve 409 por conflicto y 422 por valores inválidos; 400 por sintaxis malformada. La relación y su bitácora solo cambian al aprobar una propuesta revalidada.
    Convenciones: recursos en español, minúsculas/plural, /api/v1; JSON con propiedades camelCase, UUID y fecha ISO 8601/UTC. Enumeraciones estables mayúsculas, mensajes en español. Páginas de 25; elementos por nombre normalizado e ID (búsqueda distingue acentos), otras colecciones por ID salvo bitácora por fecha descendente e ID. GET no muta datos de negocio; puede actualizar actividad de sesión. PUT sustituye el subrecurso indicado; PATCH aplica solo propiedades enviadas. DELETE de sesión revoca y de campo retira lógicamente; no hay borrados físicos.
    Las extensiones x-acceptance-criteria indican contribución a escenarios de aceptación, no que un endpoint aislado pruebe todo el Given-When-Then. RF-08-AC-3 exige además impedir la petición vacía en el frontend; RF-13/RF-14/RF-15 requieren representación e interacción; RF-19 exige pruebas entre sesiones y RNF-04 medición en navegador. Se conserva esta distinción para la tabla de Parte 4.
    Se excluyen SSO, permisos de lectura por objeto, roles configurables, IA, importación/exportación masiva, borrado físico, migraciones de campos con datos y edición concurrente en tiempo real. Las entidades de dominio no se convierten todas en CRUD: relaciones y bitácora son lectura; su escritura pasa por los casos de uso permitidos.
    Referencia normativa: https://spec.openapis.org/oas/v3.0.3
    Revisión REST aplicada: POST procesa restablecimiento de credenciales; POST crea la preparación de demostración y GET consulta su estado sin crearla. Los 201 identifican un URI consultable mediante Location. Cuerpos JSON requieren Content-Type: application/json; otro tipo recibe 415. PATCH usa un documento parcial propio descrito por sus esquemas, no JSON Merge Patch ni JSON Patch: propiedades omitidas se conservan, null es inválido, y ElementoActualizar aplica entradas por campoId, con eliminar=true solo para un opcional. Accept-Patch: application/json anuncia ese formato en las consultas de recursos editables.
    Las extensiones x-idempotency y x-retry-policy describen efectos y reintentos. No se promete idempotencia general para POST/PATCH; decisiones repetidas devuelven 409. Los PUT conservados sustituyen estado, asignaciones o definición completa; repetir la misma representación, sin otra modificación intermedia, no produce transición de negocio adicional. Cambios concurrentes siguen sujetos a las reglas y transacciones del dominio; esta versión no incluye control optimista con ETag/If-Match.
  contact:
    name: Jean Paul Lozano Gámiz — A01840432
servers:
- url: /api/v1
  description: Ruta relativa detrás de Nginx en el mismo origen HTTPS del frontend; sin inventar un dominio de producción.
security:
- bearerAuth: []
tags:
- name: Sesiones
  description: Autenticación local y cierre individual.
- name: Cuentas
  description: Roles fijos, credenciales y edición por capa.
- name: Capas
  description: Catálogo configurable de capas.
- name: Tipos de elemento
  description: Tipos y campos configurables.
- name: Elementos
  description: Captura, validación y baja lógica.
- name: Tipos de relación
  description: Compatibilidad dirigida de extremos.
- name: Propuestas
  description: Solicitudes pendientes, correcciones y decisión humana.
- name: Relaciones
  description: Lectura de vínculos validados; sin escritura directa.
- name: Mapas
  description: Vista derivada de vecinos directos, nunca relaciones inferidas.
- name: Bitácora
  description: Auditoría inmutable sin secretos.
- name: Demostración
  description: Muestra ficticia de carga repetible.
