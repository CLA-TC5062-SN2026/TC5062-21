        '409':
          $ref: '#/components/responses/Conflicto'
        '500':
          $ref: '#/components/responses/ErrorInterno'
        '201':
          description: Preparación creada y persistida; yaExistia=false. Estado inicial PREPARADA; las relaciones
            necesitan decisiones separadas.
          headers:
            Cache-Control:
              description: No almacenar datos protegidos ni tokens.
              schema:
                type: string
                enum:
                - no-store
            Location:
              description: 'Location: /api/v1/cargas-demostracion/muestra-v1; preparación recién creada, consultable
                por GET.'
              schema:
                type: string
                format: uri-reference
              x-resource-path: /cargas-demostracion/muestra-v1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargaDemostracion'
        '422':
