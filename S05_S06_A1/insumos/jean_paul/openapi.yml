      tags:
      - Demostración
      operationId: prepararDemostracion
      summary: Preparar la muestra ficticia sin duplicados
      description: 'Solo Administrador. POST con clave muestra-v1 crea una preparación persistida y la configuración,
        objetivos, proyectos, capacidades, procesos, aplicaciones, capa adicional y propuestas de vínculos intercapas
        en una transacción. Primera preparación: 201, yaExistia=false y estado PREPARADA. Repetir la misma clave:
        200, yaExistia=true y los mismos IDs, sin duplicados ni nuevas decisiones; la clave única persistida serializa
        llamadas concurrentes. No usa scripts ni datos externos. La interfaz guía al Administrador para revisar/aprobar
        cada propuesta mediante POST /propuestas/{propuestaId}/decisiones en acciones separadas. GET /cargas-demostracion/muestra-v1
        consulta el estado: COMPLETA solo cuando todas sus propuestas están aprobadas; RF-17-AC-1 se verifica al
        completar ese recorrido. Si alguna se rechaza la muestra sigue PREPARADA y se informa el motivo; no se autoaprueban
