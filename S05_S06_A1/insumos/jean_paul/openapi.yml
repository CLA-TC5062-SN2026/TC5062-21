x-acceptance-criteria-catalog:
- id: RF-01-AC-1
  titulo: Acceso válido
  criterio: Dado que existe una cuenta activa con credenciales válidas, cuando inicia sesión, entonces se crea una
    sesión vinculada a esa cuenta y se informa su rol.
- id: RF-01-AC-2
  titulo: Acceso inválido o sin sesión
  criterio: Dado que existe un elemento registrado, cuando se intenta iniciar sesión con una contraseña incorrecta
    o solicitar directamente el elemento sin sesión válida, en ejecuciones separadas, entonces no se crea una sesión
    ni se entregan datos protegidos.
- id: RF-01-AC-3
  titulo: Cierre individual
  criterio: Dado que una cuenta tiene dos sesiones válidas A y B, cuando cierra A, entonces A deja de autorizar
    solicitudes y B continúa autorizándolas.
- id: RF-02-AC-1
  titulo: Alta y asignación
  criterio: Dado que hay un administrador y una capa Aplicaciones, cuando crea una cuenta de Editor y le asigna
    esa capa, entonces la cuenta puede iniciar sesión y crear un elemento en Aplicaciones, pero no en Negocio.
- id: RF-02-AC-2
  titulo: Cambio de rol y sesiones
  criterio: Dado que un editor tiene dos sesiones abiertas, cuando el administrador cambia su rol a Consulta, entonces
    ambas sesiones anteriores se invalidan; al iniciar una nueva, puede leer pero no modificar datos.
- id: RF-02-AC-3
  titulo: Último administrador
  criterio: Dado que solo existe un administrador activo, cuando se intenta desactivarlo o asignarle otro rol, entonces
    se rechaza la operación y permanece un administrador activo.
- id: RF-02-AC-4
  titulo: Restablecimiento y desactivación
  criterio: Dado que una cuenta tiene una sesión abierta, cuando un administrador restablece sus credenciales o
    la desactiva, en ejecuciones separadas, entonces su sesión anterior se invalida; las credenciales anteriores
    no autorizan acceso y la cuenta desactivada no puede iniciar sesión.
- id: RF-03-AC-1
  titulo: Capas iniciales y nueva capa
  criterio: Dado que la instalación acaba de prepararse, cuando el administrador consulta las capas y agrega `Seguridad`,
    entonces encuentra Negocio, Datos, Aplicaciones y Tecnología, y la nueva capa queda disponible sin reiniciar
    la aplicación.
- id: RF-03-AC-2
  titulo: Nombre repetido
  criterio: Dado que existe la capa `Seguridad`, cuando se intenta crear ` seguridad `, entonces se rechaza el duplicado
    y permanece una sola capa con ese nombre normalizado.
- id: RF-03-AC-3
  titulo: Protección por rol
  criterio: Dado que hay una sesión de Editor o Consulta, cuando solicita crear o renombrar una capa, entonces la
    operación se rechaza y las capas permanecen sin cambios.
- id: RF-04-AC-1
  titulo: Asociación
  criterio: Dado que existe la capa Negocio, cuando el administrador crea el tipo `Proyecto` en ella, entonces el
    tipo aparece asociado a Negocio y puede elegirse al registrar un elemento.
- id: RF-04-AC-2
  titulo: Identidad al renombrar
  criterio: Dado que un tipo tiene elementos, cuando el administrador renombra ese tipo, entonces conserva su identificador,
    sus campos y la asociación de los elementos existentes.
- id: RF-04-AC-3
  titulo: Asociación inválida
  criterio: Dado que no existe una capa de destino, cuando se intenta crear un tipo en ella, entonces se rechaza
    la operación y no aparece un tipo huérfano.
- id: RF-05-AC-1
  titulo: Cuatro tipos
  criterio: Dado que existe un tipo sin elementos, cuando el administrador guarda campos de texto, número, fecha
    y selección con opciones A y B, entonces se recuperan los cuatro tipos, sus opciones y su obligatoriedad configurada.
- id: RF-05-AC-2
  titulo: Configuración usada
  criterio: Dado que un tipo tiene al menos un elemento, cuando se intenta agregar un campo o cambiar el tipo u
    obligatoriedad de otro, entonces se rechaza el cambio y se conservan la definición y los elementos.
- id: RF-05-AC-3
  titulo: Nombres y permisos
  criterio: Dado que un tipo contiene el campo base `Nombre` y un campo `Descripción`, cuando el administrador intenta
    agregar ` nombre ` o `DESCRIPCIÓN`, o un Editor intenta configurar un campo, entonces se rechaza cada operación
    y la definición no cambia.
- id: RF-06-AC-1
  titulo: Registro
  criterio: Dado que un Editor puede editar Negocio y existe el tipo Proyecto, cuando registra `Proyecto Alfa` con
    valores válidos, entonces el sistema asigna un identificador único y recupera los valores y el tipo guardados.
- id: RF-06-AC-2
  titulo: Modificación
  criterio: Dado que existe un elemento con descripción `Inicial`, cuando un editor autorizado guarda `Actualizada`,
    entonces el mismo identificador conserva el nuevo valor y los demás campos no cambian.
- id: RF-06-AC-3
  titulo: Rechazo por permisos
  criterio: Dado que hay un Editor sin permiso sobre Negocio y una cuenta de Consulta, cuando cada uno intenta modificar
    un elemento de esa capa, entonces se rechazan ambos intentos y se conservan los valores originales.
- id: RF-07-AC-1
  titulo: Obligatorios
  criterio: Dado que un tipo exige Nombre y Descripción, cuando se intenta crear un elemento con cualquiera de esos
    campos vacío o compuesto solo por espacios, entonces se identifica el campo inválido y no se crea el elemento.
- id: RF-07-AC-2
  titulo: Tipos incorrectos
  criterio: Dado que un tipo tiene número, fecha y selección entre A y B, cuando se intenta guardar `abc` como número,
    30 de febrero como fecha o C como opción, en pruebas separadas, entonces se identifica el campo incorrecto y
    no se guarda ningún cambio de esa operación.
- id: RF-07-AC-3
  titulo: Campo opcional
  criterio: Dado que un campo está configurado como opcional, cuando se guarda un elemento sin valor en ese campo
    y los obligatorios son válidos, entonces el elemento se guarda y el campo opcional permanece vacío.
- id: RF-08-AC-1
  titulo: Listado paginado
  criterio: Dado que existen 30 elementos activos, cuando se abre el listado sin filtros, entonces la primera página
    contiene 25 y la segunda 5, ordenados por Nombre y luego por identificador.
- id: RF-08-AC-2
  titulo: Búsqueda parcial y duplicados
  criterio: Dado que existen dos elementos llamados `Proyecto Alfa` con IDs distintos y uno llamado `Proyecto Beta`,
    cuando se busca ` alfa `, entonces aparecen los dos primeros con identificador, nombre, tipo y capa, y cada
    selección abre su registro correspondiente.
- id: RF-08-AC-3
  titulo: Sin coincidencias o texto vacío
  criterio: Dado que hay un listado disponible, cuando se busca un nombre inexistente o un texto vacío, en pruebas
    separadas, entonces el primer caso informa cero resultados y el segundo pide escribir un nombre sin ejecutar
    la búsqueda.
- id: RF-09-AC-1
  titulo: Definición dirigida
  criterio: Dado que existen los tipos Proyecto y Capacidad, cuando el administrador crea `mejora` con origen Proyecto
    y destino Capacidad, entonces esa definición aparece al proponer Proyecto → Capacidad y no se ofrece para Capacidad
    → Proyecto.
- id: RF-09-AC-2
  titulo: Extremos inválidos
  criterio: Dado que no existe un tipo de elemento destino indicado, cuando se intenta guardar un tipo de relación
    que lo referencia, entonces se rechaza la definición y no se guarda una referencia inválida.
- id: RF-09-AC-3
  titulo: Protección por rol
  criterio: Dado que hay una sesión de Editor o Consulta, cuando solicita crear o renombrar un tipo de relación,
    entonces se rechaza la operación y el catálogo permanece igual.
- id: RF-10-AC-1
  titulo: Propuesta válida
  criterio: Dado que existen un Proyecto, una Capacidad y el tipo Proyecto → Capacidad `mejora`, cuando un editor
    autorizado propone el vínculo con una justificación válida, entonces queda una propuesta pendiente con origen,
    tipo, destino, justificación y autor, y el mapa ordinario aún no muestra ese vínculo.
- id: RF-10-AC-2
  titulo: Reglas de extremos
  criterio: Dado que existe el tipo Proyecto → Capacidad, cuando se propone un destino inexistente, un tipo de destino
    incompatible o un elemento consigo mismo, en pruebas separadas, entonces cada intento se rechaza sin crear propuesta
    ni vínculo.
- id: RF-10-AC-3
  titulo: Duplicado y justificación
  criterio: Dado que ya existe un vínculo validado no retirado o una propuesta pendiente con la misma combinación
    de origen, tipo y destino, cuando se intenta repetirla, o se envía una justificación fuera de 10 a 500 caracteres,
    entonces se rechaza la nueva propuesta y se conserva el estado previo.
- id: RF-11-AC-1
  titulo: Aprobar alta
  criterio: Dado que existe una propuesta de alta pendiente y sus dos elementos siguen activos, cuando el administrador
    la aprueba, entonces se crea una relación validada vigente, se registra decisor y fecha y el mapa ordinario
    puede mostrarla.
- id: RF-11-AC-2
  titulo: Rechazar alta
  criterio: Dado que existe una propuesta de alta pendiente, cuando el administrador la rechaza, entonces queda
    registrada la decisión y no se crea una relación validada.
- id: RF-11-AC-3
  titulo: Aprobación no autorizada
  criterio: Dado que existe una propuesta pendiente, cuando un Editor o usuario de Consulta intenta aprobarla mediante
    una petición directa, entonces la decisión se rechaza y la propuesta sigue pendiente.
- id: RF-12-AC-1
  titulo: Cambio pendiente
  criterio: Dado que existe una relación vigente R de Proyecto → Capacidad, cuando un editor autorizado propone
    cambiar su justificación o sus extremos a valores válidos, entonces la propuesta queda pendiente y R conserva
    su identificador y valores vigentes en las consultas ordinarias.
- id: RF-12-AC-2
  titulo: Aprobar o rechazar cambio
  criterio: Dado que existe una propuesta de cambio de R, cuando el administrador la aprueba, entonces R conserva
    su identificador y adopta los nuevos valores; cuando la rechaza en una ejecución independiente, entonces R conserva
    exactamente su versión anterior.
- id: RF-12-AC-3
  titulo: Propuesta simultánea y retiro
  criterio: Dado que R tiene una propuesta de cambio pendiente, cuando se intenta registrar otra propuesta para
    R, entonces se rechaza. Si la propuesta pendiente solicita retirar R y se aprueba, R queda `retirada`, se conserva
    para historial y desaparece del mapa ordinario.
- id: RF-12-AC-4
  titulo: Revalidación antes de aplicar
  criterio: Dado que una propuesta pendiente cambia el origen de R y su nuevo origen fue dado de baja antes de la
    decisión, cuando el administrador intenta aprobarla, entonces la aprobación se rechaza, la propuesta sigue pendiente
    para corrección o rechazo y R conserva sus valores vigentes. Se aplica la misma regla si la propuesta produciría
    un duplicado o extremos incompatibles.
- id: RF-13-AC-1
  titulo: Vista de conexiones
  criterio: Dado que E1 tiene vínculos validados vigentes con E2 y E3, cuando se abre el mapa de E1 sin filtros,
    entonces se muestran E1, E2, E3 y esos dos vínculos con su dirección, sin inventar otros.
- id: RF-13-AC-2
  titulo: Sin conexiones y recorrido
  criterio: Dado que E4 no tiene relaciones vigentes y existe una cadena E1 → E2 → E3, cuando se explora E4, entonces
    se muestra E4 sin aristas; cuando se explora E1 y después E2, entonces se puede ver E2 → E3 sin atribuir una
    relación directa E1 → E3.
- id: RF-13-AC-3
  titulo: Límite visible
  criterio: Dado que un elemento tiene más de 99 vecinos directos vigentes, cuando se abre su mapa, entonces se
    muestran como máximo 100 nodos contando el origen, en orden estable por identificador, y se informa que la vista
    fue truncada.
- id: RF-14-AC-1
  titulo: Cruce por capa
  criterio: Dado que E1 se relaciona con elementos de Negocio y Aplicaciones, cuando se selecciona Aplicaciones
    como capa de destino, entonces permanecen E1 y los vecinos directos de Aplicaciones con sus vínculos; los demás
    se ocultan sin borrar datos.
- id: RF-14-AC-2
  titulo: Combinación de filtros
  criterio: Dado que el mapa contiene varios tipos de elemento y relación, cuando se aplican simultáneamente filtros
    de capa, tipo de elemento y tipo de relación, entonces se muestran solo vecinos y vínculos que cumplen todos;
    E1 permanece como contexto aunque no cumpla el filtro.
- id: RF-14-AC-3
  titulo: Quitar filtros
  criterio: Dado que hay filtros activos y no cambiaron los datos ni el elemento de partida, cuando se quitan, entonces
    reaparece la vista ordinaria anterior al filtrado con sus vínculos intactos.
- id: RF-15-AC-1
  titulo: Detalle de elemento
  criterio: Dado que existe un elemento con valores configurados, cuando se selecciona su resultado de búsqueda
    o su nodo, entonces se muestran su identificador, capa, tipo, campos y valores guardados.
- id: RF-15-AC-2
  titulo: Detalle de relación
  criterio: Dado que existe un vínculo validado de A hacia B, cuando se selecciona su arista o se abre desde el
    detalle de A, entonces se muestran origen, tipo, destino, justificación, estado, autor y fechas, y se puede
    abrir la información de ambos extremos.
- id: RF-16-AC-1
  titulo: Baja conservadora
  criterio: Dado que E está activo y tiene relaciones, cuando un editor autorizado lo da de baja, entonces E conserva
    campos, relaciones e historial, y deja de aparecer en el listado y mapa ordinarios.
- id: RF-16-AC-2
  titulo: Consulta histórica y reactivación
  criterio: Dado que E está de baja, cuando un usuario activa `Incluir dados de baja`, entonces puede consultarlo
    con esa etiqueta; cuando un editor autorizado lo reactiva, entonces E vuelve a los resultados ordinarios.
- id: RF-16-AC-3
  titulo: Extremo dado de baja
  criterio: Dado que E está de baja, cuando se intenta usarlo como origen o destino de una nueva propuesta, entonces
    se rechaza la propuesta y no se modifica ninguna relación existente.
- id: RF-17-AC-1
  titulo: Carga completa
  criterio: Dado que la instalación no contiene la muestra, cuando el administrador ejecuta la carga, entonces existen
    registros ficticios de objetivos, proyectos, capacidades, procesos y aplicaciones, una capa adicional y relaciones
    entre al menos dos capas.
- id: RF-17-AC-2
  titulo: Carga repetida
  criterio: Dado que la muestra ya fue cargada, cuando se ejecuta otra vez, entonces no se duplican capas, elementos
    ni relaciones y se informa que la muestra ya existe.
- id: RF-18-AC-1
  titulo: Autoría
  criterio: Dado que Ana crea un elemento y Luis lo modifica después, cuando se consulta el detalle, entonces Ana
    permanece como creadora con su fecha y Luis aparece como último modificador con la fecha del cambio.
- id: RF-18-AC-2
  titulo: Cambio auditable
  criterio: Dado que un elemento tiene `Criticidad = Media`, cuando se actualiza a `Alta`, entonces la bitácora
    registra actor, fecha, objeto, acción, valor anterior `Media` y valor nuevo `Alta`.
- id: RF-18-AC-3
  titulo: Protección y secretos
  criterio: Dado que existe una entrada y ocurre un restablecimiento de contraseña, cuando cualquier usuario intenta
    editar la entrada o consulta el evento de restablecimiento, entonces no puede alterar la bitácora y esta no
    revela la contraseña anterior ni la nueva.
- id: RF-19-AC-1
  titulo: Configuración y registros
  criterio: Dado que se guardaron una capa, un tipo con campos, dos elementos y un vínculo validado, cuando se abre
    una sesión nueva sin estado local anterior, entonces se recuperan sus identificadores, valores y asociaciones
    sin volver a capturarlos.
- id: RF-19-AC-2
  titulo: Decisiones y permisos
  criterio: Dado que se guardaron una asignación de capa y una decisión sobre propuesta, cuando se inicia una sesión
    nueva, entonces se recuperan la asignación, el estado de la propuesta, el decisor y la fecha.
