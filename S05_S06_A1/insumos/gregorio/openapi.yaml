# S04-A2 — Partes 1 y 2. Contrato revisado contra principios REST.
openapi: "3.0.3"
info:
  title: "API de la Plataforma de Arquitectura Empresarial"
  version: "1.1.0"
  description: "Contrato de diseño de S04-A2, Partes 1 y 2. Revisión REST aplicada en revision_rest.md. Línea base: S03_A1/SRS_equipo.md v1.0 (19 RF, 56 criterios canónicos), modelo revisado de S04_A1/diagrama_clases.puml y contenedores de S04_A1/diagrama_componentes.puml. Los IDs de criterios se interpretan exclusivamente en ese SRS. JSON sobre HTTPS a través de Nginx /api; backend FastAPI y PostgreSQL. No hay borrado físico de objetos del dominio. Los x-acceptance-criteria documentan trazabilidad, no resultados de pruebas ni implementación. La interfaz y la persistencia deben verificar sus partes de los escenarios."
servers:
  -
    url: "https://arquitectura.example.com/api/v1"
    description: "URL ilustrativa del despliegue propuesto; sustituir por el host real. Nginx enruta /api al backend."
tags:
  -
    name: "Sesiones"
    description: "Autenticación local, JWT y revocación por sesión."
  -
    name: "Usuarios"
    description: "Cuentas, roles, credenciales y capas editables."
  -
    name: "Capas"
    description: "Catálogo de capas configurables."
  -
    name: "Tipos de elemento"
    description: "Definiciones asociadas a capas y campo base Nombre."
  -
    name: "Campos"
    description: "Configuración de los cuatro tipos de campo y opciones."
  -
    name: "Elementos"
    description: "Registro, actualización, consulta y ciclo de vida conservador."
  -
    name: "Tipos de relación"
    description: "Definiciones dirigidas con extremos compatibles."
  -
    name: "Propuestas de relación"
    description: "Solicitudes pendientes y decisiones humanas separadas."
  -
    name: "Relaciones validadas"
    description: "Consulta de vínculos aprobados e historial."
  -
    name: "Mapas"
    description: "Proyección de conexiones directas vigentes con filtros."
  -
    name: "Bitácora"
    description: "Historial inmutable sin secretos."
  -
    name: "Demostraciones"
    description: "Carga idempotente de datos ficticios."
security:
  -
    BearerToken: []
x-source-documents: ["../S03_A1/SRS_equipo.md", "../S04_A1/diagrama_clases.puml", "../S04_A1/diagrama_componentes.puml"]
x-design-rules: ["Todo JWT se verifica criptográficamente y contra Sesion/Usuario: estado activo, revocación, máximo 8 horas y 30 minutos de inactividad. Leer permisos del servidor en cada solicitud; no confiar en roles antiguos del token.", "Administrador hereda consulta y edición global; Editor escribe solo en capas asignadas; Consulta solo lee. Proponer cambio de origen requiere las capas del origen vigente y del propuesto. Solo Administrador decide.", "UUID es decisión del diagrama. Escritos validados, bitácora y cambios de dominio se confirman en transacciones. Rechazos conservan datos; persistencia funciona entre sesiones.", "400 significa formato ilegible; 422 significa valores o esquema inválidos; 409 significa conflicto con estado actual; 404 significa identidad inexistente. 401 es fallo de autenticación y 403 de autorización. 500 revierte transacciones.", "Extensiones x-roles y x-rejected-methods documentan reglas de autorización e inmutabilidad; OpenAPI por sí mismo no las ejecuta.", "Naming: colecciones con sustantivos en plural, minúsculas y guiones. /sesiones/actual es un alias explícito del recurso de sesión identificado por el JWT; los parámetros entre llaves son identificadores, no nombres de recursos.", "GET es seguro respecto del estado de negocio; autenticación puede actualizar última actividad y trazas técnicas. PUT/DELETE y PATCH por asignación son idempotentes en su efecto. POST no tiene garantía de reintento. x-idempotent/x-safe documentan decisiones y no ejecutan lógica del servidor."]
paths:
  "/sesiones":
    post:
      tags: ["Sesiones"]
      operationId: "iniciarSesion"
      summary: "Iniciar sesión"
      description: "Autentica credenciales locales de una cuenta activa. Crea una sesión independiente y devuelve su rol y capas actuales. Rechaza contraseñas incorrectas y cuentas desactivadas. La sesión vence a las 8 horas o tras 30 minutos de inactividad. Acceso público; no requiere una sesión previa."
      x-acceptance-criteria: ["RF-01-AC-1", "RF-01-AC-2", "RF-02-AC-4"]
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/Credenciales"
      responses:
        "201":
          description: "Recurso creado y persistido."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/TokenSesion"
          headers:
            Location:
              description: "URI del recurso o evento inmutable creado; se envía en todo 201 de este contrato. Ejemplo ficticio bajo /api/v1."
              schema:
                type: "string"
                format: "uri-reference"
              example: "/api/v1/sesiones/actual"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "422":
          $ref: "#/components/responses/422"
        "500":
          $ref: "#/components/responses/500"
      x-idempotent: false
      x-safe: false
  "/sesiones/actual":
    get:
      tags: ["Sesiones"]
      operationId: "consultarSesionActual"
      summary: "Consultar sesión y permisos actuales"
      description: "Devuelve la sesión vinculada al JWT y los permisos vigentes obtenidos del servidor. Validar firma no sustituye comprobar revocación, expiración y estado de la cuenta. Lectura disponible para toda cuenta autenticada."
      x-acceptance-criteria: ["RF-01-AC-2", "RF-01-AC-3", "RF-02-AC-1", "RF-02-AC-2", "RF-02-AC-4", "RF-19-AC-2"]
      x-roles: ["Administrador", "Editor", "Consulta"]
      responses:
        "200":
          description: "Operación completada."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Sesion"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "422":
          $ref: "#/components/responses/422"
        "500":
          $ref: "#/components/responses/500"
      x-idempotent: true
      x-safe: true
    delete:
      tags: ["Sesiones"]
      operationId: "cerrarSesionActual"
      summary: "Cerrar la sesión utilizada"
      description: "Revoca solo el sid/jti de este Bearer. Otros JWT de la cuenta continúan autorizando solicitudes. Reutilizar este JWT devuelve 401. Confirma el cierre con un mensaje JSON. Acción disponible para toda cuenta autenticada. Repetir con el JWT ya revocado devuelve 401: la sesión sigue revocada y otras sesiones no cambian. Idempotencia significa mismo efecto, no necesariamente mismo código HTTP."
      x-acceptance-criteria: ["RF-01-AC-3"]
      x-roles: ["Administrador", "Editor", "Consulta"]
      responses:
        "200":
          description: "Operación completada."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Mensaje"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "422":
          $ref: "#/components/responses/422"
        "500":
          $ref: "#/components/responses/500"
      x-idempotent: true
      x-safe: false
  "/usuarios":
    get:
      tags: ["Usuarios"]
      operationId: "listarUsuarios"
      summary: "Listar cuentas"
      description: "Lista cuentas activas e inactivas sin contraseñas ni hashes. Orden estable por identificador de acceso e ID. Solo Administrador."
      x-acceptance-criteria: ["RF-02-AC-1", "RF-02-AC-2", "RF-02-AC-4", "RF-19-AC-2"]
      x-roles: ["Administrador"]
      parameters:
        -
          $ref: "#/components/parameters/Pagina"
      responses:
        "200":
          description: "Operación completada."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Usuarios"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "422":
          $ref: "#/components/responses/422"
        "500":
          $ref: "#/components/responses/500"
      x-idempotent: true
      x-safe: true
    post:
      tags: ["Usuarios"]
      operationId: "crearUsuario"
      summary: "Crear cuenta con rol y capas"
      description: "Crea cuenta activa con exactamente un rol; asigna capas solo a Editor. Persiste usuario, asignaciones y bitácora de forma atómica. No devuelve la contraseña enviada. Solo Administrador."
      x-acceptance-criteria: ["RF-02-AC-1", "RF-18-AC-3", "RF-19-AC-2"]
      x-roles: ["Administrador"]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/UsuarioAlta"
      responses:
        "201":
          description: "Recurso creado y persistido."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Usuario"
          headers:
            Location:
              description: "URI del recurso o evento inmutable creado; se envía en todo 201 de este contrato. Ejemplo ficticio bajo /api/v1."
              schema:
                type: "string"
                format: "uri-reference"
              example: "/api/v1/usuarios/00000000-0000-4000-8000-000000000005"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "422":
          $ref: "#/components/responses/422"
        "500":
          $ref: "#/components/responses/500"
        "409":
          $ref: "#/components/responses/409"
      x-idempotent: false
      x-safe: false
      x-conflict-codes: ["IDENTIFICADOR_DUPLICADO"]
  "/usuarios/{usuarioId}":
    parameters:
      -
        name: "usuarioId"
        in: "path"
        required: true
        description: "Identificador UUID del recurso."
        schema:
          type: "string"
          format: "uuid"
    get:
      tags: ["Usuarios"]
      operationId: "consultarUsuario"
      summary: "Consultar cuenta y asignaciones"
      description: "Recupera estado, rol y capas editables de una cuenta, incluso desactivada. Solo Administrador."
      x-acceptance-criteria: ["RF-02-AC-1", "RF-02-AC-2", "RF-02-AC-4", "RF-19-AC-2"]
      x-roles: ["Administrador"]
      responses:
        "200":
          description: "Operación completada."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Usuario"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "422":
          $ref: "#/components/responses/422"
        "500":
          $ref: "#/components/responses/500"
      x-idempotent: true
      x-safe: true
    patch:
      tags: ["Usuarios"]
      operationId: "actualizarUsuario"
      summary: "Cambiar rol o estado de cuenta"
      description: "Cambios atómicos. Invalida todas las sesiones al cambiar rol o desactivar. No permite dejar cero administradores activos, incluso con solicitudes concurrentes. Registra cambios de acceso sin secretos. Solo Administrador. Este PATCH usa asignaciones de valores, no incrementos ni anexos; repetir el mismo cuerpo sin cambios externos conserva el mismo estado de negocio."
      x-acceptance-criteria: ["RF-02-AC-2", "RF-02-AC-3", "RF-02-AC-4", "RF-18-AC-3"]
      x-roles: ["Administrador"]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/UsuarioCambio"
      responses:
        "200":
          description: "Operación completada."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Usuario"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "422":
          $ref: "#/components/responses/422"
        "500":
          $ref: "#/components/responses/500"
        "409":
          $ref: "#/components/responses/409"
      x-idempotent: true
      x-safe: false
      x-conflict-codes: ["ULTIMO_ADMINISTRADOR"]
  "/usuarios/{usuarioId}/restablecimientos-contrasena":
    parameters:
      -
        name: "usuarioId"
        in: "path"
        required: true
        description: "Identificador UUID del recurso."
        schema:
          type: "string"
          format: "uuid"
    post:
      tags: ["Usuarios"]
      operationId: "restablecerContrasena"
      summary: "Restablecer contraseña"
      description: "Sustituye credenciales mediante hash resistente con sal e invalida todas las sesiones. Credenciales anteriores dejan de autorizar acceso. Bitácora conserva solo metadatos y nunca secretos. Solo Administrador. Crea y devuelve el evento de restablecimiento de la bitácora en la misma transacción; la entrada pública no contiene contraseñas ni hashes. POST no es idempotente: cada solicitud aceptada constituye un nuevo restablecimiento e invalida sesiones; no se reintenta automáticamente tras un timeout."
      x-acceptance-criteria: ["RF-02-AC-4", "RF-18-AC-3"]
      x-roles: ["Administrador"]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/RestablecimientoContrasena"
      responses:
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "422":
          $ref: "#/components/responses/422"
        "500":
          $ref: "#/components/responses/500"
        "201":
          description: "Restablecimiento realizado y evento inmutable creado, sin secretos."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/EntradaBitacora"
          headers:
            Location:
              description: "URI del recurso o evento inmutable creado; se envía en todo 201 de este contrato. Ejemplo ficticio bajo /api/v1."
              schema:
                type: "string"
                format: "uri-reference"
              example: "/api/v1/entradas-bitacora/00000000-0000-4000-8000-000000000004"
      x-idempotent: false
      x-safe: false
  "/usuarios/{usuarioId}/capas-editables":
    parameters:
      -
        name: "usuarioId"
        in: "path"
        required: true
        description: "Identificador UUID del recurso."
        schema:
          type: "string"
          format: "uuid"
    get:
      tags: ["Usuarios"]
      operationId: "consultarCapasEditables"
      summary: "Consultar capas asignadas"
      description: "Recupera el conjunto actual de asignaciones persistidas. Solo Administrador."
      x-acceptance-criteria: ["RF-02-AC-1", "RF-19-AC-2"]
      x-roles: ["Administrador"]
      responses:
        "200":
          description: "Operación completada."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/CapasEditables"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "422":
          $ref: "#/components/responses/422"
        "500":
          $ref: "#/components/responses/500"
      x-idempotent: true
      x-safe: true
    put:
      tags: ["Usuarios"]
      operationId: "reemplazarCapasEditables"
      summary: "Reemplazar el conjunto de capas editables"
      description: "PUT sustituye el conjunto completo, de forma idempotente. Solo aplica a cuentas con rol Editor. El servidor usa el nuevo conjunto en cada petición; conserva historial de asignaciones en bitácora. Solo Administrador."
      x-acceptance-criteria: ["RF-02-AC-1", "RF-19-AC-2"]
      x-roles: ["Administrador"]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/CapasEditables"
      responses:
        "200":
          description: "Operación completada."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/CapasEditables"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "422":
          $ref: "#/components/responses/422"
        "500":
          $ref: "#/components/responses/500"
      x-idempotent: true
      x-safe: false
  "/capas":
    get:
      tags: ["Capas"]
      operationId: "listarCapas"
      summary: "Consultar capas disponibles"
      description: "Devuelve capas iniciales y agregadas, ordenadas por nombre e ID. Lectura disponible para toda cuenta autenticada."
      x-acceptance-criteria: ["RF-03-AC-1", "RF-19-AC-1"]
      x-roles: ["Administrador", "Editor", "Consulta"]
      responses:
        "200":
          description: "Operación completada."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Capas"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "422":
          $ref: "#/components/responses/422"
        "500":
          $ref: "#/components/responses/500"
      x-idempotent: true
      x-safe: true
    post:
      tags: ["Capas"]
      operationId: "crearCapa"
      summary: "Crear capa"
      description: "Normaliza espacios extremos y rechaza duplicados sin distinguir mayúsculas. La nueva capa está disponible inmediatamente sin reinicio. Solo Administrador."
      x-acceptance-criteria: ["RF-03-AC-1", "RF-03-AC-2", "RF-03-AC-3", "RF-19-AC-1"]
      x-roles: ["Administrador"]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/CapaEscritura"
      responses:
        "201":
          description: "Recurso creado y persistido."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Capa"
          headers:
            Location:
              description: "URI del recurso o evento inmutable creado; se envía en todo 201 de este contrato. Ejemplo ficticio bajo /api/v1."
              schema:
                type: "string"
                format: "uri-reference"
              example: "/api/v1/capas/00000000-0000-4000-8000-000000000005"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "422":
          $ref: "#/components/responses/422"
        "500":
          $ref: "#/components/responses/500"
        "409":
          $ref: "#/components/responses/409"
      x-idempotent: false
      x-safe: false
      x-conflict-codes: ["NOMBRE_DUPLICADO"]
  "/capas/{capaId}":
    parameters:
      -
        name: "capaId"
        in: "path"
        required: true
        description: "Identificador UUID del recurso."
        schema:
          type: "string"
          format: "uuid"
    get:
      tags: ["Capas"]
      operationId: "consultarCapa"
      summary: "Consultar capa"
      description: "Recupera identidad y nombre guardados. Lectura disponible para toda cuenta autenticada."
      x-acceptance-criteria: ["RF-03-AC-1", "RF-19-AC-1"]
      x-roles: ["Administrador", "Editor", "Consulta"]
      responses:
        "200":
          description: "Operación completada."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Capa"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "422":
          $ref: "#/components/responses/422"
        "500":
          $ref: "#/components/responses/500"
      x-idempotent: true
      x-safe: true
    patch:
      tags: ["Capas"]
      operationId: "renombrarCapa"
      summary: "Renombrar capa"
      description: "Mantiene identidad y asociaciones, aplica unicidad global y registra el cambio. No elimina la capa. Solo Administrador. Este PATCH usa asignaciones de valores, no incrementos ni anexos; repetir el mismo cuerpo sin cambios externos conserva el mismo estado de negocio."
      x-acceptance-criteria: ["RF-03-AC-2", "RF-03-AC-3"]
      x-roles: ["Administrador"]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/CapaEscritura"
      responses:
        "200":
          description: "Operación completada."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Capa"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "422":
          $ref: "#/components/responses/422"
        "500":
          $ref: "#/components/responses/500"
        "409":
          $ref: "#/components/responses/409"
      x-idempotent: true
      x-safe: false
      x-conflict-codes: ["NOMBRE_DUPLICADO"]
  "/tipos-elemento":
    get:
      tags: ["Tipos de elemento"]
      operationId: "listarTiposElemento"
      summary: "Consultar tipos y formularios"
      description: "Recupera tipos, capas, campos, opciones y obligatoriedad para construir formularios. Filtrar por capa no modifica datos. Lectura disponible para toda cuenta autenticada."
      x-acceptance-criteria: ["RF-04-AC-1", "RF-05-AC-1", "RF-19-AC-1"]
      x-roles: ["Administrador", "Editor", "Consulta"]
      parameters:
        -
          name: "capaId"
          in: "query"
          required: false
          description: "Restringe al catálogo de una capa existente."
          schema:
            type: "string"
            format: "uuid"
      responses:
        "200":
          description: "Operación completada."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/TiposElemento"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "422":
          $ref: "#/components/responses/422"
        "500":
          $ref: "#/components/responses/500"
      x-idempotent: true
      x-safe: true
    post:
      tags: ["Tipos de elemento"]
      operationId: "crearTipoElemento"
      summary: "Crear tipo asociado a una capa"
      description: "Crea tipo y campo base Nombre en una transacción. Rechaza capa inexistente con 404 y nombre repetido dentro de esa capa con 409. Solo Administrador."
      x-acceptance-criteria: ["RF-04-AC-1", "RF-04-AC-3", "RF-19-AC-1"]
      x-roles: ["Administrador"]
      requestBody:
        required: true
        content:
