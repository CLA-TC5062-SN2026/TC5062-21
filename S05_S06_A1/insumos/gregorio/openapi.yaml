components:
  securitySchemes:
    BearerToken:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "Authorization: Bearer <JWT>. Sesiones independientes con revocación comprobada en servidor; firma válida por sí sola no garantiza acceso."
  parameters:
    Pagina:
      name: "pagina"
      in: "query"
      description: "Página desde 1; tamaño fijo de 25."
      schema:
        type: "integer"
        minimum: 1
        default: 1
    IncluirBaja:
      name: "incluirBaja"
      in: "query"
      description: "Permite consultar elementos dados de baja con su etiqueta. No cambia el mapa ordinario."
      schema:
        type: "boolean"
        default: false
  responses:
    "400":
      description: "Solicitud mal formada (por ejemplo JSON ilegible). No se aplican cambios."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    "401":
      description: "Credenciales incorrectas, cuenta inactiva o JWT ausente, inválido, expirado o sesión revocada/inactiva. No se entregan datos privados."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
      headers:
        WWW-Authenticate:
          description: "Obligatorio en toda respuesta 401. Challenge Bearer; un JWT presentado pero inválido puede añadir error=\"invalid_token\"."
          schema:
            type: "string"
          example: "Bearer realm=\"arquitectura\""
    "403":
      description: "Sesión válida sin rol o capa de edición requeridos. No se aplican cambios."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    "404":
      description: "Recurso o referencia solicitada inexistente."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    "422":
      description: "Contenido legible que incumple esquema o reglas de los valores: obligatorio vacío, tipo/fecha/opción inválidos, extremos incompatibles o inactivos, autorrelación o justificación fuera de rango. detalles identifica los datos inválidos. No hay cambios parciales. Los conflictos con el estado actual se devuelven como 409."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    "500":
      description: "Fallo interno. Mensaje genérico sin secretos. Las escrituras fallidas se revierten."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    "405":
      description: "Método no permitido: la bitácora es inmutable."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
      headers:
        Allow:
          description: "Obligatorio en respuesta 405: métodos que sí admite esta URI de entrada inmutable."
          schema:
            type: "string"
            enum: ["GET"]
          example: "GET"
    "409":
      description: "Conflicto con el estado actual: duplicado, estructura bloqueada, versión obsoleta, propuesta ya resuelta o pendiente simultánea, último administrador. No se altera ningún recurso. El cliente debe revisar el estado antes de intentar otra operación."
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Rol:
      type: "string"
      enum: ["Administrador", "Editor", "Consulta"]
    NombreCatalogo:
      type: "string"
      minLength: 1
      pattern: "\\S"
      description: "Se recortan espacios extremos; se rechaza texto vacío. Unicidad de capas global, de tipos por capa y de campos por tipo, sin distinguir mayúsculas."
    Mensaje:
      type: "object"
      additionalProperties: false
      properties:
        mensaje:
          type: "string"
      required: ["mensaje"]
    Error:
      type: "object"
      additionalProperties: false
      properties:
        codigo:
          type: "string"
          description: "Código estable de la causa, por ejemplo NOMBRE_DUPLICADO, SIN_PERMISO o CAMPO_INVALIDO."
        mensaje:
          type: "string"
          description: "Explicación en español sin trazas internas ni secretos."
        detalles:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            properties:
              campo:
                type: "string"
                description: "Ruta del dato inválido, por ejemplo valores[0].numero."
              motivo:
                type: "string"
            required: ["campo", "motivo"]
      required: ["codigo", "mensaje", "detalles"]
    Credenciales:
      type: "object"
      additionalProperties: false
      properties:
        identificadorAcceso:
          type: "string"
          minLength: 1
        contrasena:
          type: "string"
          minLength: 1
          writeOnly: true
          format: "password"
      required: ["identificadorAcceso", "contrasena"]
    Usuario:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          format: "uuid"
          readOnly: true
        identificadorAcceso:
          type: "string"
        rol:
          $ref: "#/components/schemas/Rol"
        activo:
          type: "boolean"
        capasEditables:
          type: "array"
          items:
            type: "string"
            format: "uuid"
          uniqueItems: true
      required: ["id", "identificadorAcceso", "rol", "activo", "capasEditables"]
    UsuarioAlta:
      type: "object"
      additionalProperties: false
      properties:
        identificadorAcceso:
          type: "string"
          minLength: 1
          pattern: "\\S"
        contrasenaInicial:
          type: "string"
          minLength: 1
          writeOnly: true
          format: "password"
        rol:
          $ref: "#/components/schemas/Rol"
        capasEditables:
          type: "array"
          items:
            type: "string"
            format: "uuid"
          uniqueItems: true
          default: []
      required: ["identificadorAcceso", "contrasenaInicial", "rol"]
      description: "Identificador de acceso único. Capas editables solo para Editor; para otros roles debe ser una lista vacía. Todas las capas deben existir. Política de complejidad de contraseña pendiente de definición fuera del SRS."
    UsuarioCambio:
      type: "object"
      additionalProperties: false
      properties:
        rol:
          $ref: "#/components/schemas/Rol"
        activo:
          type: "boolean"
      minProperties: 1
      description: "Cambio parcial y atómico. Cambiar rol o desactivar invalida todas las sesiones. Cambiar a un rol distinto de Editor vacía las asignaciones actuales conservando su historial. Se protege al último administrador activo."
    RestablecimientoContrasena:
      type: "object"
      additionalProperties: false
      properties:
        nuevaContrasena:
          type: "string"
          minLength: 1
          writeOnly: true
          format: "password"
      required: ["nuevaContrasena"]
    CapasEditables:
      type: "object"
      additionalProperties: false
      properties:
        capaIds:
          type: "array"
          items:
            type: "string"
            format: "uuid"
          uniqueItems: true
      required: ["capaIds"]
      description: "Conjunto completo de capas asignadas a un Editor. Lista vacía significa solo lectura. No se duplican asignaciones; las retiradas se conservan en bitácora."
    TokenSesion:
      type: "object"
      additionalProperties: false
      properties:
        accessToken:
          type: "string"
          description: "JWT firmado; incluye sub (usuario), sid (sesión), jti, iat y exp. Nunca se almacena en bitácora."
        tokenType:
          type: "string"
          enum: ["Bearer"]
        expiresIn:
          type: "integer"
          minimum: 1
          maximum: 28800
        expiraEn:
          type: "string"
          format: "date-time"
        usuario:
          $ref: "#/components/schemas/Usuario"
        sesionId:
          type: "string"
          format: "uuid"
          description: "ID de la sesión creada y representada por /sesiones/actual al presentar este JWT."
      required: ["accessToken", "tokenType", "expiresIn", "expiraEn", "usuario", "sesionId"]
    Sesion:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          format: "uuid"
        usuario:
          $ref: "#/components/schemas/Usuario"
        creadaEn:
          type: "string"
          format: "date-time"
        ultimaActividadEn:
          type: "string"
          format: "date-time"
        expiraEn:
          type: "string"
          format: "date-time"
      required: ["id", "usuario", "creadaEn", "ultimaActividadEn", "expiraEn"]
    CapaEscritura:
      type: "object"
      additionalProperties: false
      properties:
        nombre:
          $ref: "#/components/schemas/NombreCatalogo"
      required: ["nombre"]
    Capa:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          format: "uuid"
          readOnly: true
        nombre:
          type: "string"
      required: ["id", "nombre"]
    TipoElementoAlta:
      type: "object"
      additionalProperties: false
      properties:
        nombre:
          $ref: "#/components/schemas/NombreCatalogo"
        capaId:
          type: "string"
          format: "uuid"
      required: ["nombre", "capaId"]
    TipoElementoNombre:
      type: "object"
      additionalProperties: false
      properties:
        nombre:
          $ref: "#/components/schemas/NombreCatalogo"
      required: ["nombre"]
    OpcionCampoEscritura:
      type: "object"
      additionalProperties: false
      properties:
        etiqueta:
          type: "string"
          minLength: 1
          pattern: "\\S"
        orden:
          type: "integer"
          minimum: 0
      required: ["etiqueta", "orden"]
    OpcionCampo:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          format: "uuid"
          readOnly: true
        etiqueta:
          type: "string"
        orden:
          type: "integer"
          minimum: 0
      required: ["id", "etiqueta", "orden"]
    CampoEscritura:
      type: "object"
      additionalProperties: false
      properties:
        nombre:
          $ref: "#/components/schemas/NombreCatalogo"
        tipoDato:
          type: "string"
          enum: ["texto", "numero", "fecha", "seleccion"]
        obligatorio:
          type: "boolean"
        opciones:
          type: "array"
          items:
            $ref: "#/components/schemas/OpcionCampoEscritura"
      required: ["nombre", "tipoDato", "obligatorio", "opciones"]
      description: "Selección requiere al menos una opción; otros tipos requieren opciones vacías. Se rechaza Nombre reservado o cualquier nombre duplicado. Solo se configura si el tipo nunca ha tenido elementos. Nombre base no se modifica."
    Campo:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          format: "uuid"
          readOnly: true
        tipoElementoId:
          type: "string"
          format: "uuid"
        nombre:
          type: "string"
        tipoDato:
          type: "string"
          enum: ["texto", "numero", "fecha", "seleccion"]
        obligatorio:
          type: "boolean"
        esBaseNombre:
          type: "boolean"
        opciones:
          type: "array"
          items:
            $ref: "#/components/schemas/OpcionCampo"
      required: ["id", "tipoElementoId", "nombre", "tipoDato", "obligatorio", "esBaseNombre", "opciones"]
    TipoElemento:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          format: "uuid"
          readOnly: true
        nombre:
          type: "string"
        capaId:
          type: "string"
          format: "uuid"
        estructuraBloqueada:
          type: "boolean"
          readOnly: true
        campos:
          type: "array"
          items:
            $ref: "#/components/schemas/Campo"
          minItems: 1
      required: ["id", "nombre", "capaId", "estructuraBloqueada", "campos"]
      description: "Incluye exactamente un campo base Nombre de texto, obligatorio e inalterable. La estructura queda bloqueada si existe cualquier elemento del tipo, incluso de baja. Renombrar el tipo sigue permitido."
    ValorCampo:
      oneOf:
        -
          type: "object"
          additionalProperties: false
          properties:
            campoId:
              type: "string"
              format: "uuid"
            texto:
              type: "string"
          required: ["campoId", "texto"]
        -
          type: "object"
          additionalProperties: false
          properties:
            campoId:
              type: "string"
              format: "uuid"
            numero:
              type: "number"
              format: "double"
          required: ["campoId", "numero"]
        -
          type: "object"
          additionalProperties: false
          properties:
            campoId:
              type: "string"
              format: "uuid"
            fecha:
              type: "string"
              format: "date"
          required: ["campoId", "fecha"]
        -
          type: "object"
          additionalProperties: false
          properties:
            campoId:
              type: "string"
              format: "uuid"
            opcionId:
              type: "string"
              format: "uuid"
          required: ["campoId", "opcionId"]
      description: "Exactamente una representación por campo, compatible con su definición. Número finito, fecha real de calendario u opción de la lista del campo. No se admite un campo ajeno al tipo ni IDs repetidos. Nombre y textos obligatorios se rechazan vacíos o con solo espacios."
    ValorCampoVacio:
      type: "object"
      additionalProperties: false
      properties:
        campoId:
          type: "string"
          format: "uuid"
        vaciar:
          type: "boolean"
          enum: [true]
      required: ["campoId", "vaciar"]
      description: "Permite vaciar un campo opcional; elimina su valor presente conservando bitácora. Se rechaza en Nombre y otros campos obligatorios."
    ElementoAlta:
      type: "object"
      additionalProperties: false
      properties:
        tipoElementoId:
          type: "string"
          format: "uuid"
        valores:
          type: "array"
          items:
            $ref: "#/components/schemas/ValorCampo"
          minItems: 1
      required: ["tipoElementoId", "valores"]
      description: "Debe incluir Nombre y todos los campos obligatorios. Campos opcionales omitidos quedan vacíos. Toda la escritura se valida y confirma en una transacción."
    ElementoCambio:
      type: "object"
      additionalProperties: false
      properties:
        valores:
          type: "array"
          items:
            oneOf:
              -
                $ref: "#/components/schemas/ValorCampo"
              -
                $ref: "#/components/schemas/ValorCampoVacio"
          minItems: 1
        estado:
          type: "string"
          enum: ["activo"]
          description: "Reactivación explícita. La baja lógica se realiza mediante DELETE del elemento."
      description: "Objeto parcial con valores, estado=activo o ambos. No admite objeto vacío. Campos omitidos se conservan. Si un campo falla no se guardan valores ni transición de estado. Una asignación idéntica conserva fechas y autoría."
      minProperties: 1
    Autoria:
      type: "object"
      additionalProperties: false
      properties:
        creadorId:
          type: "string"
          format: "uuid"
        creadoEn:
          type: "string"
          format: "date-time"
        ultimoModificadorId:
          type: "string"
          format: "uuid"
        modificadoEn:
          type: "string"
          format: "date-time"
      required: ["creadorId", "creadoEn", "ultimoModificadorId", "modificadoEn"]
    ElementoResumen:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          format: "uuid"
          readOnly: true
        nombre:
          type: "string"
        tipoElemento:
          $ref: "#/components/schemas/TipoReferencia"
        capa:
          $ref: "#/components/schemas/Capa"
        estado:
          type: "string"
          enum: ["activo", "baja"]
      required: ["id", "nombre", "tipoElemento", "capa", "estado"]
    TipoReferencia:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          format: "uuid"
        nombre:
          type: "string"
      required: ["id", "nombre"]
    Elemento:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          format: "uuid"
          readOnly: true
        nombre:
          type: "string"
        tipoElemento:
          $ref: "#/components/schemas/TipoReferencia"
        capa:
          $ref: "#/components/schemas/Capa"
        estado:
          type: "string"
          enum: ["activo", "baja"]
        campos:
          type: "array"
          items:
            $ref: "#/components/schemas/Campo"
          minItems: 1
        valores:
          type: "array"
          items:
            $ref: "#/components/schemas/ValorCampo"
          minItems: 1
        autoria:
          $ref: "#/components/schemas/Autoria"
      required: ["id", "nombre", "tipoElemento", "capa", "estado", "campos", "valores", "autoria"]
      description: "Nombre se deriva del valor del campo base. Los campos opcionales vacíos no tienen entrada en valores. Los IDs de campos y sus opciones permiten interpretar cada valor. No incluye secretos."
    TipoRelacionAlta:
      type: "object"
      additionalProperties: false
      properties:
        nombre:
          type: "string"
          minLength: 1
          pattern: "\\S"
        descripcion:
          type: "string"
          minLength: 1
          pattern: "\\S"
        tipoOrigenId:
          type: "string"
          format: "uuid"
        tipoDestinoId:
          type: "string"
          format: "uuid"
      required: ["nombre", "descripcion", "tipoOrigenId", "tipoDestinoId"]
    TipoRelacionCambio:
      type: "object"
      additionalProperties: false
      properties:
        nombre:
          type: "string"
          minLength: 1
          pattern: "\\S"
        descripcion:
          type: "string"
          minLength: 1
          pattern: "\\S"
      minProperties: 1
      description: "Se puede renombrar y actualizar la descripción. Los tipos permitidos no cambian para conservar la compatibilidad de vínculos históricos; crear otra definición si se necesitan otros extremos."
    TipoRelacion:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          format: "uuid"
          readOnly: true
        nombre:
          type: "string"
          minLength: 1
          pattern: "\\S"
        descripcion:
          type: "string"
          minLength: 1
          pattern: "\\S"
        tipoOrigenId:
          type: "string"
          format: "uuid"
        tipoDestinoId:
          type: "string"
          format: "uuid"
      required: ["id", "nombre", "descripcion", "tipoOrigenId", "tipoDestinoId"]
    PropuestaAlta:
      type: "object"
      additionalProperties: false
      properties:
        operacion:
          type: "string"
          enum: ["alta"]
        origenId:
          type: "string"
          format: "uuid"
        tipoRelacionId:
          type: "string"
          format: "uuid"
        destinoId:
          type: "string"
          format: "uuid"
        justificacion:
          type: "string"
          minLength: 10
          maxLength: 500
          description: "Se recortan espacios extremos antes de medir; debe justificar la propuesta para la revisión humana."
      required: ["operacion", "origenId", "tipoRelacionId", "destinoId", "justificacion"]
    PropuestaCambio:
      type: "object"
      additionalProperties: false
      properties:
        operacion:
          type: "string"
          enum: ["cambio"]
        relacionId:
          type: "string"
          format: "uuid"
        versionBase:
          type: "integer"
          minimum: 1
        origenId:
          type: "string"
          format: "uuid"
        tipoRelacionId:
          type: "string"
          format: "uuid"
        destinoId:
          type: "string"
          format: "uuid"
        justificacion:
          type: "string"
          minLength: 10
          maxLength: 500
          description: "Se recortan espacios extremos antes de medir; debe justificar la propuesta para la revisión humana."
      required: ["operacion", "relacionId", "versionBase", "origenId", "tipoRelacionId", "destinoId", "justificacion"]
      description: "Valores completos solicitados para la relación objetivo. Al aprobar mantiene identidad y queda vigente. Editor requiere permiso en el origen vigente y en el propuesto."
    PropuestaRetiro:
      type: "object"
      additionalProperties: false
      properties:
        operacion:
          type: "string"
          enum: ["retiro"]
        relacionId:
          type: "string"
          format: "uuid"
        versionBase:
          type: "integer"
          minimum: 1
        justificacion:
          type: "string"
          minLength: 10
          maxLength: 500
          description: "Se recortan espacios extremos antes de medir; debe justificar la propuesta para la revisión humana."
      required: ["operacion", "relacionId", "versionBase", "justificacion"]
      description: "Extremos y tipo se copian de la relación objetivo vigente. Solicita estado retirada sin alterar todavía el vínculo."
    PropuestaEscritura:
      oneOf:
        -
          $ref: "#/components/schemas/PropuestaAlta"
        -
          $ref: "#/components/schemas/PropuestaCambio"
        -
          $ref: "#/components/schemas/PropuestaRetiro"
      discriminator:
        propertyName: "operacion"
        mapping:
          alta: "#/components/schemas/PropuestaAlta"
          cambio: "#/components/schemas/PropuestaCambio"
          retiro: "#/components/schemas/PropuestaRetiro"
    PropuestaCorreccion:
      type: "object"
      additionalProperties: false
      properties:
        origenId:
          type: "string"
          format: "uuid"
        tipoRelacionId:
          type: "string"
          format: "uuid"
        destinoId:
          type: "string"
          format: "uuid"
        justificacion:
          type: "string"
          minLength: 10
          maxLength: 500
          description: "Se recortan espacios extremos antes de medir; debe justificar la propuesta para la revisión humana."
        versionBase:
          type: "integer"
          minimum: 1
      minProperties: 1
      description: "Corrección parcial solo mientras la propuesta esté pendiente. No cambia operación ni relación objetivo. Para retiro solo justificación/versionBase; los extremos siguen siendo los vigentes. Se vuelven a validar permisos, actividad de extremos, compatibilidad y duplicados."
    Propuesta:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          format: "uuid"
          readOnly: true
        operacion:
          type: "string"
          enum: ["alta", "cambio", "retiro"]
        estado:
          type: "string"
          enum: ["pendiente", "aprobada", "rechazada"]
        origenId:
          type: "string"
          format: "uuid"
        tipoRelacionId:
          type: "string"
          format: "uuid"
        destinoId:
          type: "string"
          format: "uuid"
        justificacion:
          type: "string"
          minLength: 10
          maxLength: 500
          description: "Se recortan espacios extremos antes de medir; debe justificar la propuesta para la revisión humana."
        estadoSolicitado:
          type: "string"
          enum: ["vigente", "retirada"]
        relacionId:
          type: "string"
          format: "uuid"
          nullable: true
        relacionResultadoId:
          type: "string"
          format: "uuid"
          nullable: true
        versionBase:
          type: "integer"
          minimum: 1
          nullable: true
        autorId:
          type: "string"
          format: "uuid"
        creadaEn:
          type: "string"
          format: "date-time"
        decisorId:
          type: "string"
          format: "uuid"
          nullable: true
        decididaEn:
          type: "string"
          format: "date-time"
          nullable: true
      required: ["id", "operacion", "estado", "origenId", "tipoRelacionId", "destinoId", "justificacion", "estadoSolicitado", "relacionId", "relacionResultadoId", "versionBase", "autorId", "creadaEn", "decisorId", "decididaEn"]
      description: "Alta: relacionId y versionBase nulos; relacionResultadoId solo existe después de aprobar. Cambio/retiro: relacionId y versionBase obligatorios. Decisor y fecha nulos hasta resolver. Solo una propuesta pendiente por relación objetivo."
    DecisionPropuesta:
      type: "object"
      additionalProperties: false
      properties:
        decision:
          type: "string"
          enum: ["aprobar", "rechazar"]
      required: ["decision"]
    Relacion:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          format: "uuid"
          readOnly: true
        origen:
          $ref: "#/components/schemas/ElementoResumen"
        tipoRelacion:
          $ref: "#/components/schemas/TipoRelacion"
        destino:
          $ref: "#/components/schemas/ElementoResumen"
        justificacion:
          type: "string"
        estado:
          type: "string"
          enum: ["vigente", "retirada"]
        version:
          type: "integer"
          minimum: 1
        autoria:
          $ref: "#/components/schemas/Autoria"
      required: ["id", "origen", "tipoRelacion", "destino", "justificacion", "estado", "version", "autoria"]
    DecisionResultado:
      type: "object"
      additionalProperties: false
      properties:
        propuesta:
          $ref: "#/components/schemas/Propuesta"
        relacion:
          allOf:
            -
              $ref: "#/components/schemas/Relacion"
          description: "Propiedad ausente al rechazar un alta, porque no se creó relación. Para cambio/retiro rechazado devuelve la relación conservada; al aprobar devuelve el estado aplicado."
        entradaBitacoraId:
          type: "string"
          format: "uuid"
          description: "Identidad del evento inmutable de esta decisión; permite recuperarlo mediante GET /entradas-bitacora/{entradaId}."
      required: ["propuesta", "entradaBitacoraId"]
    AristaMapa:
      type: "object"
      additionalProperties: false
      properties:
        relacionId:
          type: "string"
          format: "uuid"
        origenId:
          type: "string"
          format: "uuid"
        destinoId:
          type: "string"
          format: "uuid"
        tipoRelacionId:
          type: "string"
          format: "uuid"
        tipoRelacionNombre:
          type: "string"
      required: ["relacionId", "origenId", "destinoId", "tipoRelacionId", "tipoRelacionNombre"]
    Mapa:
      type: "object"
      additionalProperties: false
      properties:
        elementoPartidaId:
          type: "string"
          format: "uuid"
        nodos:
          type: "array"
          items:
            $ref: "#/components/schemas/ElementoResumen"
          minItems: 1
          maxItems: 100
        aristas:
          type: "array"
          items:
            $ref: "#/components/schemas/AristaMapa"
        truncado:
          type: "boolean"
        totalNodosElegibles:
          type: "integer"
          minimum: 1
      required: ["elementoPartidaId", "nodos", "aristas", "truncado", "totalNodosElegibles"]
      description: "Partida primero, vecinos ordenados por identificador. Solo relaciones directas vigentes con ambos extremos activos y visibles. No se infieren aristas ni se incluyen propuestas. Total incluye partida y vecinos únicos que cumplen filtros antes del límite de 100. truncado indica totalNodosElegibles > 100."
    EntradaBitacora:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          format: "uuid"
          readOnly: true
        actorId:
          type: "string"
          format: "uuid"
        fecha:
          type: "string"
          format: "date-time"
        tipoObjeto:
          type: "string"
        objetoId:
          type: "string"
          format: "uuid"
        accion:
          type: "string"
        valoresAntes:
          type: "object"
          additionalProperties: true
          nullable: true
          description: "Instantánea de los campos públicos cambiados; excluye contraseñas, hashes, JWT, tokens y demás secretos."
        valoresDespues:
          type: "object"
          additionalProperties: true
          nullable: true
          description: "Instantánea pública nueva. En restablecimiento solo metadatos de la operación."
      required: ["id", "actorId", "fecha", "tipoObjeto", "objetoId", "accion", "valoresAntes", "valoresDespues"]
    DemostracionResultado:
      type: "object"
      additionalProperties: false
      properties:
        muestraId:
          type: "string"
          enum: ["arquitectura-ficticia-v1"]
        ficticia:
          type: "boolean"
          enum: [true]
        creada:
          type: "boolean"
        mensaje:
          type: "string"
        capaIds:
          type: "array"
          items:
            type: "string"
            format: "uuid"
        elementoIds:
          type: "array"
          items:
            type: "string"
            format: "uuid"
        relacionIds:
          type: "array"
          items:
            type: "string"
            format: "uuid"
      required: ["muestraId", "ficticia", "creada", "mensaje", "capaIds", "elementoIds", "relacionIds"]
